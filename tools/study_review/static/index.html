<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* One question on the screen, three big buttons. Nothing else competes with them. */
:root {
  --bg: #101216; --panel: #171a20; --panel2: #1d2128; --line: #2a2f38; --fg: #ebe9e2; --mute: #9aa0aa;
  --gold: #e9cd77; --good: #3fbf7a; --warn: #e3a64a; --bad: #e5585a; --focus: #f5e29a;
  --display: 'Fraunces', Georgia, serif; --body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f2ea; --panel: #ffffff; --panel2: #f0ede2; --line: #d8d3c4; --fg: #1b1d22; --mute: #5b6068;
  --gold: #8a6a12; --good: #1b8a4f; --warn: #9a6200; --bad: #b8323a; --focus: #8a6a12; color-scheme: light; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px; line-height: 1.5; }
button, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 14px 18px 40px; }
.top { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
.top h1 { font: 700 20px var(--display); margin: 0; flex: 1; }
.progress { font-size: 15px; color: var(--mute); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.progress b { color: var(--fg); }
.saved { font-size: 14px; color: var(--good); min-width: 70px; text-align: right; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--panel2); border-radius: 12px; padding: 4px; }
#tab3 { order: 1; } #tab4 { order: 2; } #tab1 { order: 3; } #tab2 { order: 4; }
.tab { min-height: 46px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--mute); font: 600 15px var(--body); cursor: pointer; padding: 4px 8px; line-height: 1.2; }
.tab small { display: block; font: 400 12px var(--body); }
.tab.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); border-color: var(--line); }
.saved.err { color: var(--bad); font-weight: 700; }
.menubtn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 14px; cursor: pointer; font-weight: 700; }
.bar { height: 8px; background: var(--panel2); border-radius: 5px; margin: 12px 0 6px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .25s; }
.bar .k { background: var(--good); } .bar .f { background: var(--warn); } .bar .c { background: var(--bad); }
.prog { margin-bottom: 16px; }
.banner { background: var(--panel2); border: 2px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin-bottom: 14px; }
.where { color: var(--mute); font-size: 15px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.chip { display: inline-block; border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--mute); }
.lab { font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px; }
.lab.now { color: var(--gold); }
.was { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px 4px; margin: 0 0 14px; background: color-mix(in srgb, var(--panel2) 60%, transparent); opacity: .92; }
.was .q { font-size: 18px; margin: 0 0 8px; } .was .story { margin-bottom: 8px; }
.was .choices li { padding: 7px 12px; font-size: 16px; background: transparent; }
.was .choices li.right { border-width: 1px; }
.was .fill { font-size: 17px; }
.new { display: inline-block; font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 0 7px; margin-left: 8px; vertical-align: middle; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { min-height: 40px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0 14px; cursor: pointer; font-size: 15px; }
.chipbtn:hover { border-color: var(--gold); }
.srcfirst { margin: 0 0 10px; font-size: 15px; color: var(--mute); }
.srcfirst q { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; quotes: none; color: var(--fg); border-left: 3px solid var(--gold); padding-left: 10px; font-style: italic; }
.srcfirst small { display: block; margin: 3px 0 0 13px; }
.keys { color: var(--mute); font-size: 13px; text-align: center; margin: 6px 0 0; }
@media (hover: none) { .keys, .act small.kh { display: none; } }
.flag { background: var(--panel2); border: 2px solid var(--warn); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.flag b { color: var(--warn); }
.fyi { color: var(--mute); font-size: 15px; margin: 0 0 12px; }
.story { background: var(--panel2); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
.q { font: 600 clamp(22px, 3.4vw, 28px)/1.3 var(--display); margin: 0 0 16px; text-wrap: pretty; }
.choices { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
.choices li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; background: var(--panel); }
.choices .L { color: var(--mute); font-weight: 700; }
.choices li.right { border: 2px solid var(--good); background: color-mix(in srgb, var(--good) 14%, var(--panel)); }
.choices li.right .L { color: var(--good); }
.fill { font-size: 22px; margin: 0 0 16px; } .fill mark { background: color-mix(in srgb, var(--good) 25%, transparent); color: var(--fg); padding: 0 6px; border-radius: 6px; border-bottom: 2px solid var(--good); }
.answerbox { display: inline-block; border: 2px solid var(--good); border-radius: 10px; padding: 8px 16px; font: 700 24px var(--display); margin: 0 0 16px; }
.why { margin: 0 0 12px; } .why b { color: var(--gold); }
details { margin: 0 0 10px; color: var(--mute); font-size: 16px; }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
details p, details div { margin: 6px 0; }
.src q { display: block; quotes: none; color: var(--fg); border-left: 3px solid var(--line); padding-left: 10px; }
.src small { color: var(--mute); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 8px; position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 22%); padding: 22px 0 10px; }
.act { min-height: 72px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font: 700 19px var(--body); display: grid; place-items: center; padding: 6px; }
.act small { display: block; font: 400 13px var(--body); color: var(--mute); }
.act.good { border-color: var(--good); } .act.change { border-color: var(--warn); } .act.remove { border-color: var(--bad); }
.act.good:hover { background: var(--good); color: #04140b; } .act.change:hover { background: var(--warn); color: #1c1100; } .act.remove:hover { background: var(--bad); color: #1f0506; }
.act.on.good { background: var(--good); color: #04140b; } .act.on.change { background: var(--warn); color: #1c1100; } .act.on.remove { background: var(--bad); color: #1f0506; }
.act.suggest::after { content: "★ Claude suggests"; display: block; font: 600 12px var(--body); margin-top: 2px; }
.act:hover small, .act.on small { color: inherit; }
.noteBox { margin: 18px 0 8px; display: grid; gap: 10px; }
.noteBox label { font-weight: 700; }
.noteBox textarea { width: 100%; min-height: 110px; background: var(--panel); border: 2px solid var(--gold); border-radius: 12px; padding: 12px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.primary { min-height: 56px; padding: 0 26px; border-radius: 12px; border: 0; background: var(--gold); color: #1a1405; font: 700 18px var(--body); cursor: pointer; }
.plain { background: none; border: 0; color: var(--mute); cursor: pointer; font-size: 16px; min-height: 44px; padding: 0 10px; text-decoration: underline; }
.nav { display: flex; justify-content: space-between; align-items: center; }
.said { color: var(--mute); font-size: 15px; }
.done { text-align: center; padding: 40px 10px; } .done h2 { font: 700 28px var(--display); margin: 0 0 10px; }
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 50; overflow: auto; }
.panel { max-width: 640px; margin: 0 auto; padding: 18px; display: grid; gap: 14px; }
.panel h2 { font: 700 24px var(--display); margin: 0; }
.big { min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font: 700 17px var(--body); text-align: left; padding: 8px 16px; }
.big small { display: block; font: 400 14px var(--body); color: var(--mute); }
.panel select { width: 100%; min-height: 52px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.list { display: grid; gap: 8px; }
.item { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.item .t { font-weight: 700; } .item .n { color: var(--mute); font-size: 15px; }
.tag { display: inline-block; font: 700 12px var(--body); border-radius: 999px; padding: 1px 9px; margin-right: 6px; }
.tag.fix { background: var(--warn); color: #1c1100; } .tag.cut { background: var(--bad); color: #1f0506; }
.mono { font-family: Consolas, monospace; font-size: 14px; color: var(--mute); word-break: break-all; }
@media (max-width: 560px) { body { font-size: 17px; } .act { font-size: 16px; min-height: 64px; } .progress { font-size: 14px; } .wrap { padding: 10px 14px 28px; } .tab { font-size: 14px; } .choices li { grid-template-columns: 38px 1fr; padding: 10px 12px; } }
.chipbtn.on { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 700; }
.guide { background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; font-size: 16px; }
.guide ol { margin: 6px 0 10px 18px; padding: 0; } .guide li { margin: 3px 0; }
.rule { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 12px; padding: 12px 14px 12px; margin: 14px 0; background: var(--panel); }
.rule .rtext { margin: 2px 0 8px; font-weight: 600; font-size: 17px; }
.rmeta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 14px; color: var(--mute); margin-bottom: 8px; }
.st { display: inline-block; font: 700 12px var(--body); border-radius: 999px; padding: 1px 10px; border: 1px solid currentColor; }
.st.settled { color: var(--good); } .st.proposed { color: var(--warn); } .st.pending-owner { color: var(--bad); }
.rbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rbtn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-weight: 600; font-size: 15px; }
.rbtn.on.ok { background: var(--good); color: #04140b; border-color: var(--good); } .rbtn.on.bad { background: var(--warn); color: #1c1100; border-color: var(--warn); }
.flag.mild { border-color: var(--line); } .flag.mild b { color: var(--gold); }
.dp { margin: 0 0 10px; } .dp.deflt { border: 2px solid var(--gold); border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--gold) 12%, var(--panel)); }
.dp.dmeta { color: var(--mute); font-size: 15px; }
.tw { overflow-x: auto; margin: 0 0 10px; } .tw table { border-collapse: collapse; font-size: 15px; } .tw td, .tw th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.dl { margin: 0 0 10px; padding-left: 22px; } code { font-family: Consolas, monospace; font-size: .9em; background: var(--panel2); padding: 0 4px; border-radius: 4px; }
.act.ask { border-color: var(--gold); } .act.ask:hover, .act.on.ask { background: var(--gold); color: #1a1405; }
.rl { padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; color: var(--mute); } .rl b { color: var(--fg); }
.sm { font-size: 14px; min-height: 32px; padding: 0 4px; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.tagc { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 14px; background: var(--panel); }
.tagc b { color: var(--gold); }
.fbh { font: 700 18px var(--display); margin: 14px 0 6px; }
.item .tg { display: block; color: var(--gold); font-size: 13px; font-weight: 700; margin-top: 2px; }
.cnt { color: var(--mute); font-size: 15px; margin: 0; }
@media (max-width: 560px) { .tabs { grid-template-columns: 1fr 1fr; } .tab { font-size: 13px; padding: 4px 4px; } .tab small { font-size: 11px; } }
.ab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; font-size: 15px; color: var(--mute); }
.abbtn { min-height: 40px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0 14px; cursor: pointer; font-size: 15px; }
.abbtn.on { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 700; }
.lsrow { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.lsrow .t { font-weight: 700; } .lsrow .n { color: var(--mute); font-size: 14px; }
.stat { display: inline-block; font: 700 12px var(--body); border-radius: 999px; padding: 1px 10px; border: 1px solid currentColor; white-space: nowrap; }
.stat.ok { color: var(--good); } .stat.wip { color: var(--gold); } .stat.bad { color: var(--bad); } .stat.idle { color: var(--mute); }
.simpleline { margin: 0 0 10px; padding: 8px 12px; border-left: 4px solid var(--gold); background: var(--panel2); border-radius: 0 10px 10px 0; font-weight: 600; }
</style></head><body>
<div class="wrap">
  <div class="top">
    <h1>Library Review</h1>
    <span class="saved" id="saved"></span>
    <button class="menubtn" id="menuBtn" type="button">Menu</button>
  </div>
  <div class="tabs" role="group" aria-label="Which part">
    <button class="tab" id="tab1" type="button"></button>
    <button class="tab" id="tab2" type="button"></button>
    <button class="tab" id="tab3" type="button"></button>
    <button class="tab" id="tab4" type="button"></button>
  </div>
  <div class="prog">
    <div class="bar" aria-hidden="true"><i class="k" id="barK"></i><i class="f" id="barF"></i><i class="c" id="barC"></i></div>
    <div class="progress" id="progress" aria-live="polite"></div>
  </div>
  <div class="banner" id="saveBanner" hidden></div>
  <main id="main"><p class="where">Loading…</p></main>
</div>
<div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>

<script>
(function () {
  'use strict';
  var S = { idx: null, bySlug: {}, ofId: {}, calls: {}, reviews: {}, data: {}, qById: {}, loads: {},
            stage: 1, queue: [], pos: 0, noteFor: null, file: '', queueOut: [], flushing: false, fails: 0, times: [], rules: {}, decs: [], decById: {}, sideNote: null, noteTags: [], _tagsFor: null, curRule: null };
  var VLABEL = { keep: 'Good as is', fix: 'Change it', cut: 'Remove it' };
  var REASONS_FIX = ['Simple answer is not simple', 'Full answer is missing something', 'Fourth answer is too obvious', 'Fourth answer could also be right', 'The right answer is wrong', 'Two answers could be right', 'A wrong answer is obviously wrong', 'Confusing wording', 'Does not match my rules', 'Out of date', 'Too easy', 'Too hard'];
  var REASONS_CUT = ['Repeats another question', 'Not worth teaching', 'Wrong or unsafe', 'Does not match my rules'];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function cap(t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); }
  function nf(n) { return Number(n).toLocaleString('en-US'); }

  // ── saving: every decision goes to the local program, which writes it to a file on this computer ──────────────
  var QKEY = 'libreview2.queue';
  S.queueOut = lsGet(QKEY, []);
  function setSaved(msg, err) { var el = $('saved'); el.textContent = msg || ''; el.className = 'saved' + (err ? ' err' : ''); }
  function renderBanner() {
    var el = $('saveBanner');
    if (S.queueOut.length && S.fails > 0) {
      el.hidden = false;
      el.textContent = 'NOT SAVED YET. ' + S.queueOut.length + ' decision(s) are waiting because the review program is not answering. Do not close this tab. If the black window was closed, double-click Start Library Review again and come back here. This page keeps trying.';
    } else { el.hidden = true; }
  }
  function persistRec(item) {
    item.tags = item.tags || [];
    S.reviews[item.id] = { v: item.v, note: item.note || '', tags: item.tags, kind: item.kind, unit: item.unit, key: item.key, q: item.q, at: new Date().toISOString() };
    S.queueOut = S.queueOut.filter(function (x) { return x.id !== item.id; }); S.queueOut.push(item); lsSet(QKEY, S.queueOut);
    setSaved('Saving…'); flush();
  }
  function flush() {
    if (S.flushing) return;
    if (!S.queueOut.length) { renderBanner(); return; }
    S.flushing = true; var item = S.queueOut[0];
    fetch('api/verdict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function () {
        S.queueOut = S.queueOut.filter(function (x) { return x !== item; }); lsSet(QKEY, S.queueOut);
        S.flushing = false; S.fails = 0;
        if (S.queueOut.length) flush(); else { setSaved('Saved ✓'); renderBanner(); }
      })
      .catch(function () { S.flushing = false; S.fails++; setSaved('Not saved', true); renderBanner(); setTimeout(flush, 3000); });
  }
  window.addEventListener('beforeunload', function (e) { if (S.queueOut.length) { e.preventDefault(); e.returnValue = ''; } });

  // ── data ─────────────────────────────────────────────────────────────────────────────────────────────────────
  function loadTrack(track) {
    if (S.loads[track]) return S.loads[track];
    S.loads[track] = fetch('data/track-' + track + '.json').then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
      .then(function (all) {
        Object.keys(all).forEach(function (u) { all[u].questions.forEach(function (q, i) { q._i = i + 1; q._n = all[u].questions.length; S.qById[q.id] = q; }); S.data[u] = all[u]; });
      }, function (e) { S.loads[track] = null; throw e; });
    return S.loads[track];
  }
  function ensure(id) { return S.qById[id] ? Promise.resolve() : loadTrack(S.ofId[id].track); }
  function prefetchNext() { var n = S.queue[S.pos + 3]; if (n && !S.qById[n]) loadTrack(S.ofId[n].track).catch(function () {}); }

  function budget() { var b = Number(lsGet('libreview3.budget', 150)); return b > 0 ? b : 150; }
  function todayCount() {
    var day = new Date().toDateString(), n = 0;
    Object.keys(S.reviews).forEach(function (id) { var r = S.reviews[id]; if (r && r.v && r.at && S.ofId[id] && new Date(r.at).toDateString() === day) n++; });
    return n;
  }
  function decided(id) { var r = S.reviews[id]; return !!(r && r.v); }
  // ── Part 4: the sample review (docs/study/OVERBUILD_PLAN.md section 7) ─────────────────────────────────────────
  var SAMPLE_FIRST = 5, SAMPLE_WIDE = 10;      // owner 2026-11-12: 5 per lesson; one defect widens it to 15
  function isUp(id) { var c = S.calls[id]; return !!(c && /Upgraded/.test(c.r || '')); }
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function unitSample(u) {
    var ups = u.ids.filter(isUp).sort(function (a, b) { return hash(a) - hash(b); });
    var first = ups.slice(0, SAMPLE_FIRST).sort(function (a, b) { return ((S.calls[b].rk || 0) - (S.calls[a].rk || 0)) || (hash(a) - hash(b)); });
    var firstDone = first.filter(decided), firstDefects = firstDone.filter(function (id) { return S.reviews[id].v !== 'keep'; }).length;
    var wide = [], status = 'idle', label = 'not started';
    if (!ups.length) { status = 'idle'; label = 'nothing upgraded yet'; }
    else if (firstDone.length < first.length) { status = firstDone.length ? 'wip' : 'idle'; label = firstDone.length ? 'sampling' : 'not started'; }
    else if (firstDefects === 0) { status = 'ok'; label = 'approved; the rest is machine-approved'; }
    else if (firstDefects >= 3) { status = 'bad'; label = 'back to the pipeline'; }
    else {
      wide = ups.slice(SAMPLE_FIRST, SAMPLE_FIRST + SAMPLE_WIDE);
      var wd = wide.filter(decided), wdef = wd.filter(function (id) { return S.reviews[id].v !== 'keep'; }).length;
      if (wd.length < wide.length) { status = 'wip'; label = 'widened to ' + (first.length + wide.length) + ' (' + firstDefects + ' defect found)'; }
      else if (firstDefects + wdef >= 3) { status = 'bad'; label = 'back to the pipeline'; }
      else { status = 'ok'; label = 'approved after fixes'; }
    }
    return { ups: ups.length, first: first, wide: wide, status: status, label: label, done: firstDone.length + wide.filter(decided).length, total: first.length + wide.length };
  }
  // owner 2026-11-14: the sample review goes core first (setups, risk, orders, process...), options last

      h += '</div>';
    }
    if (g.rule.length) { h += '<div class="fbh">Rules that need work</div><div class="list">' + g.rule.map(function (x) { var rr = S.rules[x.id.slice(5)]; return row(x, 'Rule', 'fix', '', rr ? rr.setup : x.id.slice(5), x.r.q); }).join('') + '</div>'; }
    if (g.decision.length) { h += '<div class="fbh">Decisions</div><div class="list">' + g.decision.map(function (x) { return row(x, x.r.v === 'ask' ? 'Talk' : 'Change', 'fix', 'd:' + x.id, x.id.slice(4) + ' · ' + x.r.q, ''); }).join('') + '</div>'; }
    if (g.unit.length) { h += '<div class="fbh">Lesson notes</div><div class="list">' + g.unit.map(function (x) { return row(x, 'Lesson', 'fix', '', x.r.q || x.id, ''); }).join('') + '</div>'; }
    if (g.general.length) { h += '<div class="fbh">General notes</div><div class="list">' + g.general.map(function (x) { return row(x, 'Note', 'fix', '', 'General', ''); }).join('') + '</div>'; }
    if (!allFeedback().some(function (x) { return x.r.v !== 'keep'; })) h += '<p class="said">Nothing flagged yet. Everything you press Change, Remove or Rule needs work on shows up here.</p>';
    $('panel').innerHTML = h;
    $('fBack').onclick = openMenu; $('fCopy').onclick = function () { copyText(feedbackText(), this); }; $('fBackup').onclick = downloadBackup;
    $('panel').querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () {
        var go = b.getAttribute('data-go'), id = go.slice(2);
        closeMenu();
        if (go.charAt(0) === 'q') setStage(2, buildQueue(2).indexOf(id));
        else setStage(3, buildQueue(3).indexOf('dec:' + id.replace(/^dec:/, '')));
      };
    });
  }
  function downloadBackup() {
    var lines = allFeedback().map(function (x) { var r = x.r; return JSON.stringify({ id: x.id, kind: x.kind, unit: r.unit || (S.ofId[x.id] ? S.ofId[x.id].unit : ''), key: r.key || '', verdict: r.v, note: r.note, tags: r.tags || [], q: r.q || '', at: r.at }); });
    var text = lines.join(String.fromCharCode(10)) + String.fromCharCode(10);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = 'library-review-backup-' + new Date().toISOString().slice(0, 10) + '.jsonl';
    document.body.appendChild(a); a.click(); a.remove(); setSaved('Backup downloaded');
  }

  // ── keys ─────────────────────────────────────────────────────────────────────────────────────────────────────
  document.addEventListener('keydown', function (e) {
    var t = e.target && e.target.tagName;
    if (e.key === 'Escape' && !$('overlay').hidden) { closeMenu(); return; }
    if (t === 'TEXTAREA' || t === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey || !$('overlay').hidden) return;
    if (S.pause) { if (e.key === 'Enter' && t !== 'BUTTON') { e.preventDefault(); resume(); } return; }
    if (S.noteFor || S.sideNote || S.pos >= S.queue.length) return;
    var id = S.queue[S.pos]; if (!id) return;
    if (S.stage !== 3 && !S.qById[id]) return;
    var k = e.key, again = function () { if (S.stage === 3) renderDecision(id); else renderCard(id); };
    if (k === 'Enter') { if (t === 'BUTTON' || t === 'A' || t === 'SUMMARY') return; e.preventDefault(); decide('keep', ''); }
    else if (k === 'c' || k === 'C') { S.noteFor = 'fix'; again(); e.preventDefault(); }
    else if ((k === 'x' || k === 'X') && S.stage !== 3) { S.noteFor = 'cut'; again(); e.preventDefault(); }
    else if ((k === 't' || k === 'T') && S.stage === 3) { S.noteFor = 'ask'; again(); e.preventDefault(); }
    else if (k === 'ArrowLeft') back();
    else if (k === 'ArrowRight') skip();
  });
  $('menuBtn').onclick = openMenu;
  [1, 2, 3, 4].forEach(function (n) { $('tab' + n).onclick = function () { if (S.stage !== n) setStage(n); }; });

  // ── start ────────────────────────────────────────────────────────────────────────────────────────────────────
  function jget(url, dflt) { return fetch(url).then(function (r) { return r.ok ? r.json() : dflt; }).catch(function () { return dflt; }); }
  Promise.all([
    fetch('data/index.json').then(function (r) { return r.json(); }),
    fetch('api/verdicts').then(function (r) { return r.json(); }),
    jget('data/calls.json', {}), jget('data/rules.json', {}), jget('data/decisions.json', [])
  ]).then(function (res) {
    S.idx = res[0]; S.calls = res[2] || {}; S.file = res[1].file || ''; S.rules = res[3] || {};
    S.decs = (res[4] || []).filter(function (d) { return d.part === 'A' || d.part === 'B'; });
    S.decs.forEach(function (d) { S.decById[d.id] = d; });
    S.idx.units.forEach(function (u) { S.bySlug[u.slug] = u; u.ids.forEach(function (id) { S.ofId[id] = { slug: u.slug, unit: u.unit, title: u.title, track: u.track }; }); });
    Object.keys(res[1].records || {}).forEach(function (id) { var r = res[1].records[id]; S.reviews[id] = { v: r.v, note: r.note, tags: r.tags || [], kind: r.kind, unit: r.unit, key: r.key, q: r.q, at: r.at }; });
    S.queueOut.forEach(function (it) { S.reviews[it.id] = { v: it.v, note: it.note, tags: it.tags || [], kind: it.kind, unit: it.unit, key: it.key, q: it.q, at: '' }; });
    var look = buildQueue(1);
    // the recommended path: the decisions first, then the sample review; the full pass stays optional
    var stage = buildQueue(3).some(function (id) { return !decided(id); }) ? 3 : 4;
    setStage(stage); flush();
  }, function () {
    $('main').innerHTML = '<div class="banner">The review program is not running. Double-click <b>Start Library Review</b>, then reload this page.</div>';
  });
})();
</script>
</body></html>
