# promotion-gate: yes — UCT Agent's own regression suites: a red here means an Agent behaviour
#   (routing, approvals, receipts, Undo, indicator settings, watchlists, chart actions) or the
#   JS ⇄ Python manifest contract broke. Added 2026-10-11 after the UIE + Agent release
#   (ee373f1215) shipped with NO gate running these: `master deploy gate` runs none of them and
#   `full suite (report-only)` never blocks (and was cancelled on that commit).
# UCT Agent guard.
#
# ⛔ NO PATH FILTER, ON PURPOSE. The Agent is reached THROUGH other features' modules — that
# release changed the Agent's behaviour via Indicators (agentMutations, indicatorCatalog,
# instanceControls) and Screener (filters, snapshot) files. A path list would skip exactly the
# changes that broke it before; "not run" would read as "not relevant" to the promotion gate.
#
# Scope: the Agent's frontend suite (app/src/agent — the live-model capture/flow files skip
# themselves without their env) plus the Indicators interface it drives, and the Agent's
# backend suite (tests/test_uct_agent*.py, which runs the golden manifest through the server's
# own validator). Deterministic: no model call, no network beyond installs.
name: UCT Agent guard

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Agent frontend suite + the Indicators interface it drives
        working-directory: app
        run: >-
          npx vitest run src/agent
          src/components/chart/builder/agentMutations.test.js
          src/components/chart/builder/agentMutations.inputs.test.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install --quiet -r requirements.txt pytest

      - name: Agent backend suite (incl. the manifest contract)
        run: python -m pytest -q -p no:cacheprovider tests/test_uct_agent*.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::UCT Agent's backend tests failed — the server half of the Agent (turn, routes, manifest contract) changed behaviour."
          echo "Run locally: python -m pytest -q tests/test_uct_agent*.py"
