# promotion-gate: no — a scheduled DATA check (cash-index intraday holes); it never runs on a push and never decides promotion.
#
# ─── INDEX GAP SCAN: a vendor hole in a cash index's intraday bars is found by us, not by a member ──────────
#
# WHY. 2026-11-18: production's SPX 60m series had no bar from 2026-01-30 11:30 to 2026-02-02 12:30 ET and
# no 12:30 bar on any 13:00 half-day, for months, because Yahoo's own answer had the hole. A member's Fred
# RS run found it by refusing. Nothing of ours was looking.
#
# WHAT. tools/index_gap_scan.py reads what the site serves for SPX, NDX, RUT and DJX at 60m and 30m (the
# same unauthenticated GET /api/bars a chart makes) and lists every bucket `intraday_gap_audit.
# expected_rth_buckets` expects of a SETTLED session that is absent and NOT already named in the answer's
# `holes` (index_bars names what no vendor has). It reads no secret and writes nothing.
#
# WHEN. Weekdays 22:45 UTC (17:45 EST / 18:45 EDT: after the close and the 30-minute settle), and by hand.
#
# THE ALERT IS A RED RUN: exit 1 = unnamed holes (listed in the log), exit 2 = a series could not be
# checked. GitHub mails the owner on a failed scheduled run. Rails: tests/test_index_gap_scan.py.
name: index gap scan

on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-gap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # the bucket authority (intraday_gap_audit -> bars_fetch) imports the app's own modules
      - name: Install
        run: python -m pip install --quiet -r requirements.txt

      - name: Index gap scan
        run: python tools/index_gap_scan.py
