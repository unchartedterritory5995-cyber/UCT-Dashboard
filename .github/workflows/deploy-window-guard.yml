# Market-hours deploy guard.
#
# `.git/hooks/pre-push` makes the deploy freeze mechanical — but only for people
# pushing from a clone. A commit authored in the GitHub web UI never runs a local
# hook, so for that path the guard is bypassed by construction, not by override.
# Three web-UI commits to api/massive_ws_worker.py landed mid-session that way
# between 2026-07-21 and 2026-07-24, each one bouncing the flow-worker and
# gapping the OPRA tape permanently. Nothing surfaced them at the time.
#
# HONEST SCOPE: this is a DETECTOR, not a blocker. A push-triggered workflow runs
# after the push has landed and after Railway has already been triggered, so it
# cannot stop the deploy — it makes the violation loud within about a minute
# instead of discovered days later while reading git log. Turning it into a real
# block needs branch protection: PR-only master with this as a required check.
#
# Rule and watched-file list both come from tools/git-hooks/pre-push, so the two
# guards cannot drift apart.
name: Deploy window guard

on:
  push:
    branches: [master]

jobs:
  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the deploy window
        id: check
        run: |
          set +e
          BEFORE="${{ github.event.before }}"
          ARGS="--sha $GITHUB_SHA"
          # A new branch or a force-push gives an unusable "before" — fall back
          # to the head commit's own diff rather than guessing a range.
          if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            ARGS="$ARGS --base $BEFORE"
          fi
          # Evaluate at RUN time, not author time: it is the push that deploys.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python tools/check_deploy_window.py $ARGS --at "$NOW" | tee verdict.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          CODE="${{ steps.check.outputs.code }}"
          if [ "$CODE" = "0" ]; then
            echo "Outside the freeze window — nothing to flag."
            exit 0
          fi
          if [ "$CODE" = "2" ]; then
            echo "::error::Deploy-window guard could not evaluate the rule (see log)."
            echo "The guard failed to read the ET clock or the FLOW_WATCHED list in"
            echo "tools/git-hooks/pre-push. Fix the guard — do not assume compliance."
            exit 1
          fi
          echo "::error::Pushed to master during the market-hours deploy freeze."
          cat verdict.txt
          echo ""
          echo "If you committed from the GitHub web UI: the local pre-push hook"
          echo "cannot see that path, which is why this check exists."
          exit 1

      - name: Ping Discord
        # Best-effort. A missing webhook must never change the guard's verdict.
        if: failure() && steps.check.outputs.code == '1'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK_URL secret configured — skipping the ping."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          body = open("verdict.txt", encoding="utf-8").read().strip()
          sha = os.environ["GITHUB_SHA"][:8]
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://github.com/{repo}/commit/{os.environ['GITHUB_SHA']}"
          msg = f"🚨 **Market-hours deploy** — `{sha}`\n```\n{body[:1500]}\n```\n{url}"
          req = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps({"content": msg}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=10)
          print("Discord notified.")
          PY
