# promotion-gate: no — it is a MEASUREMENT, and it says so itself: "IT SETS NO BAR."
#   It prints a delta for the owner to read and carries a continue-on-error step. A
#   job with no pass/fail criterion cannot gate anything; treating it as a gate would
#   be inventing a bar the file explicitly refuses to set.
# P2-LINUX-OCR-VERSION-CERT — the 5.3.0 measurement, on a Linux that is not this box.
#
# ⛔⛔ WHY THIS FILE EXISTS. Production runs Tesseract 5.3.0 (Debian bookworm);
# every quality number in Wave P was measured on 5.4.0 on Windows. The ruling
# was right that those numbers do not transfer for free, and four local routes
# to a runnable 5.3.0 were tried and all failed (no Docker toolchain on the dev
# box, WSL not installed and not ours to install, conda-forge 5.3.0 and 5.3.4
# both STATUS_DLL_NOT_FOUND). The owner's decision was explicit: do NOT install
# WSL or Docker just for this, and do NOT overwrite the working local 5.4.0.
#
# ⭐ A GITHUB-HOSTED RUNNER IS A LINUX THAT ALREADY EXISTS. This job runs inside
# `python:3.12-slim-bookworm` — the SAME base `Dockerfile.web`'s runtime stage
# uses — and installs `tesseract-ocr tesseract-ocr-eng` with the same
# `--no-install-recommends`, so the engine under test is the one that ships.
#
# ⛔ THE CORPUS IS SYNTHETIC AND REPO-OWNED, AND THAT IS A HARD RULE. It is
# FROZEN in `tools/wave_p_cert_corpus/` — generated by `tools/wave_p_fixtures.py`
# from repo-tracked fonts, then committed so the ENGINE is the one variable. No
# member Notebook document, no production note, no production database, no
# credentials, ever. This job talks to nothing but the checkout.
#
# ⛔ AND IT REFUSES TO PRODUCE AN INCOMPARABLE NUMBER. The corpus is generated,
# not committed, so before measuring anything the run proves the page images are
# byte-identical to the ones the 5.4.0 reference was measured on. A recall
# figure from a corpus that drifted by one pixel is worse than no figure,
# because it looks like an answer.
#
# ⛔ IT SETS NO BAR. "Do not retune against 5.3.0 before first measurement."
# The comparison prints the delta and the benchmark's own findings; closing
# P2-LINUX-OCR-VERSION-CERT is the owner reading those numbers.
name: OCR Linux version cert

# ⭐ THE TESSERACT LANE (2026-11-21): `tesseract-tests` below runs, on pull requests, the tests that need a REAL
# tesseract binary. They carry `skipif(_TESS_BIN is None)` so a machine without one (the remote tests lane, most
# laptops) skips them instead of reading red, and this job installs tesseract and FAILS on such a skip, so a skip
# never means "runs nowhere". tests/test_ocr_tesseract_lane.py derives the tests and holds this job to them. It sets
# a bar where the measurement job above sets none, so it is its own job, on its own trigger; the measurement still
# runs only on a push to its own paths or by hand.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ocr-linux-cert.yml'
      - 'tests/test_document_ocr.py'
      - 'tests/test_ocr_tesseract_lane.py'
      - 'api/services/journal_two/document_ocr.py'
      - 'api/services/journal_two/document_ocr_tesseract.py'
      - 'api/services/journal_two/document_extraction.py'
      - 'api/services/journal_two/ask_evidence.py'
  push:
    # The merge queue builds each queued pull request on a temporary gh-readonly-queue/** branch, and a push
    # trigger with no branch filter runs on every one of them (rehearsed 2026-11-22). tests/test_ci_cost_rails.py.
    branches-ignore: ['gh-readonly-queue/**']
    # Deliberately narrow: this must not fire on unrelated work. A workflow that
    # runs on everything gets ignored, which is how the guard beside this one
    # explains its own scope.
    paths:
      - '.github/workflows/ocr-linux-cert.yml'
      - 'tools/wave_p_cert_corpus/**'
      - 'tools/wave_p0_ocr_benchmark.py'
      - 'tools/wave_p15_tesseract_benchmark.py'
      - 'tools/wave_p_corpus_signature.py'
      - 'tools/wave_p_corpus_signature.json'
      - 'tools/wave_p_ocr_version_compare.py'
      - 'tools/wave_p_ocr_reference_5_4_0.json'

# CI COST: a newer push to the same PR cancels that PR's older run; a push or a dispatch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bookworm:
    # the measurement: a push to its own paths, or by hand; never on a pull request (it sets no bar)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.12-slim-bookworm
    steps:
      # git first: the slim image has none, and actions/checkout needs it.
      - name: The runtime the web image installs, and nothing else
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            tesseract-ocr \
            tesseract-ocr-eng
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: What is actually installed here
        run: |
          set -eux
          tesseract --version
          dpkg-query -W -f='${Package} ${Version}\n' tesseract-ocr tesseract-ocr-eng
          # ⭐ The recognition MODEL was already proven byte-identical to the
          # file the 5.4.0 benchmark ran against (Wave P1.5 §J):
          #   4,113,088 bytes
          #   7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          # Printing it here keeps that claim a measurement rather than a
          # remembered fact.
          sha256sum /usr/share/tesseract-ocr/*/tessdata/eng.traineddata

      # ⛔ The two the measurement actually imports, and no more — this job
      # must not drag in the app's runtime. (numpy went away with the generator
      # step: the benchmark's tesseract path never touches it.)
      #
      # ⛔ pypdf IS PINNED TO THE VERSION THE REFERENCE WAS MEASURED WITH.
      # Unpinned, run #4 came back with the two NATIVE pages' CER moved from
      # 0.0 to 0.0013 — pages OCR never touches, so that was pypdf 6.18 reading
      # a text layer a hair differently from 6.15. Harmless, and exactly the
      # kind of noise that makes a reader wonder which column the engine is in.
      # The engine is the one variable this job is allowed to change.
      - name: Benchmark dependencies only
        run: pip install --no-cache-dir --disable-pip-version-check pillow "pypdf==6.15.0"

      # ⛔ The searchability metric is an FTS5 query, so a python built against
      # a sqlite without FTS5 would fail deep inside the benchmark and read as
      # an OCR problem. Ask the question here, where the answer is legible.
      - name: The searchability metric needs FTS5
        run: |
          python - <<'PY'
          import sqlite3, sys
          c = sqlite3.connect(":memory:")
          try:
              c.execute("CREATE VIRTUAL TABLE t USING fts5(x)")
          except sqlite3.OperationalError as e:
              print(f"REFUSING: no FTS5 in this sqlite ({e}). The search-recall "
                    "number cannot be computed here.", file=sys.stderr)
              raise SystemExit(2)
          print("fts5 present ·", sqlite3.sqlite_version)
          PY

      # ⚰️ THIS STEP USED TO GENERATE THE CORPUS, AND THE CHECK BELOW CAUGHT IT.
      # Regenerating inside this container moved ALL ELEVEN page images — same
      # script, same seeds, a different Pillow/FreeType. The run would have
      # reported a 5.3.0 recall number measured on different pixels, and it would
      # have looked like an answer. The corpus is frozen in the repo now, so the
      # ENGINE is the only variable this job changes.
      - name: Refuse a corpus that is not the one the reference was measured on
        run: python tools/wave_p_corpus_signature.py

      - name: Tesseract, same corpus, same metrics, baseline settings
        id: bench
        continue-on-error: true
        # One line on purpose: a line-continuation here was mangled into a
        # literal `\n` on its way into this file and the run died on
        # "unrecognized arguments: n n n".
        run: python tools/wave_p15_tesseract_benchmark.py --tesseract tesseract --fixtures tools/wave_p_cert_corpus --label linux-bookworm

      - name: 5.4.0 (measured) against this (what ships)
        run: |
          python tools/wave_p_ocr_version_compare.py \
            --reference tools/wave_p_ocr_reference_5_4_0.json \
            --candidate tools/wave_p15_tesseract_out/linux-bookworm.json

      - uses: actions/upload-artifact@v4
        with:
          name: ocr-linux-cert
          path: tools/wave_p15_tesseract_out/linux-bookworm.json
          if-no-files-found: error

      # ⛔ The benchmark exits non-zero on its OWN findings. Those must not be
      # swallowed just because the comparison table printed — but the table has
      # to print first, or a failing run tells you nothing about WHY.
      - name: Carry the benchmark's verdict
        if: steps.bench.outcome == 'failure'
        run: |
          echo "The benchmark reported findings on this engine — see the step above."
          exit 1

  tesseract-tests:
    name: the tests that need a real tesseract
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Tesseract, as the web image installs it
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: The production dependency set and the CI-only packages (as remote tests installs them)
        run: |
          sudo mkdir -p /data && sudo chown "$(id -u):$(id -g)" /data
          python -m pip install --quiet -r requirements.txt pytest httpx pyyaml
          if [ -f tests/ci-only-packages.txt ]; then python -m pip install --quiet -r tests/ci-only-packages.txt; fi
      - name: The tesseract tests, with the binary present (a tesseract skip here is a failure)
        run: |
          set -euo pipefail
          python -m pytest tests/test_document_ocr.py tests/test_ocr_tesseract_lane.py -q -p no:cacheprovider -rs             --junitxml=tesseract-tests.xml
          # the binary is installed, so a test skipped for want of it means the lane is not doing its one job
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          skipped = [(c.get("classname"), c.get("name"), s.get("message") or "")
                     for c in ET.parse("tesseract-tests.xml").iter("testcase") for s in c.findall("skipped")]
          bad = [x for x in skipped if "tesseract" in x[2].lower()]
          for x in bad:
              print(f"::error::skipped for want of tesseract on the tesseract lane: {x[0]}::{x[1]} ({x[2]})")
          sys.exit(1 if bad else 0)
          PY
