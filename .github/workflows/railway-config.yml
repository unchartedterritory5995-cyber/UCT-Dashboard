# promotion-gate: no
#
# Railway stops reading `railway.json` / `railway.toml` on 2026-12-01. From then a service runs
# on the settings Railway has STORED for it, and the config files in this repo reach Railway only
# through `tools/railway_stored_settings.py --apply`. This job makes sure that tool can carry
# every setting those files contain:
#
#   * its comparison reports each kind of difference (and none where there is none);
#   * every key in `railway.web.json` and `railway.json` is one it knows how to store. Add a key
#     it does not know and this goes red, instead of the key being merged and never reaching
#     Railway.
#
# It needs no Railway access and no application dependencies. It does NOT prove that Railway's
# stored settings match the files today: that needs a signed-in Railway CLI and is run by a
# person, `python tools/railway_stored_settings.py` (runbook: docs/runbooks/railway-config-cutoff.md).
#
# Advisory for now (`no`): nothing here is a broken deploy by itself. Promote it only with a run
# seen red and a run seen green recorded here, as the other gating workflows do.
name: Railway config

on:
  push:
    paths:
      - 'railway.json'
      - 'railway.web.json'
      - 'tools/railway_stored_settings.py'
      - 'tests/test_railway_stored_settings.py'
      - '.github/workflows/railway-config.yml'
  pull_request:
    paths:
      - 'railway.json'
      - 'railway.web.json'
      - 'tools/railway_stored_settings.py'
      - 'tests/test_railway_stored_settings.py'
      - '.github/workflows/railway-config.yml'

# CI COST (2026-11-06, owner): a newer push to the same PR cancels that PR's older run of this
# workflow. Every other event (master push, dispatch, schedule) is grouped by its own commit SHA and
# is never cancelled: promotion reads the master runs for a SHA. tests/test_ci_cost_rails.py pins this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stored-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --quiet 'pytest==8.3.4' 'pytest-timeout==2.4.0'
      - name: The tool's own self-check
        run: python tools/railway_stored_settings.py --self-check
      - name: tests/test_railway_stored_settings.py
        # An empty ini file, not the repo's pytest.ini: the repo's conftest and plugins need the
        # whole application installed, and this tool needs nothing.
        run: |
          echo "[pytest]" > "$RUNNER_TEMP/empty.ini"
          python -m pytest tests/test_railway_stored_settings.py -q --noconftest -c "$RUNNER_TEMP/empty.ini" --rootdir . -p no:cacheprovider --timeout 120 -rs
