# promotion-gate: no — DETECTION AND CLEAN-UP ONLY. It decides nothing and promotion never reads it. The one thing it
#   writes is a cancel on a stuck `master deploy gate` run, so that run concludes and its verdict goes red.
# A job on an offline runner does not fail: it stays queued for up to 24 hours and holds the serial gate queue. Hosted,
# because a watch on the watched machine cannot report that machine's death. It goes red on anything stuck, and a red
# scheduled run emails the workflow's last editor. tools/ci_queue_watch.py refuses to cancel promotion, in code.
# COST: one billed minute per run, so ~1,440 minutes a month at this cadence. A stuck gate is cancelled 45-75 min in.
name: ci queue watch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ci-queue-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only to cancel a stuck gate run

jobs:
  watch:
    name: no self-hosted job stuck in the queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Report jobs queued 45 minutes or more, and cancel a stuck gate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_queue_watch.py watch --labels uct-vps --minutes 45 --cancel-workflow "master deploy gate"
