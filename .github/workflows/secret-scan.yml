# promotion-gate: no
#
# Secret scan on every master push and every PR: gitleaks over the NEW commits only.
#
# WHY: the repo went PUBLIC on 2026-11-08 (free/faster Actions while we build with 0 users).
# Anything pushed is readable by the internet, and bots harvest keys from new public commits
# within minutes. GitHub push protection (on) blocks KNOWN provider formats at push time, web-UI
# commits included; this catches what it does not know: generic tokens, keys inside URLs
# (`?auth=`, `?apiKey=`), which is exactly how the one real finding of the pre-flip scan leaked
# (a Finviz token inside a pasted prod log).
#
# WHY ADVISORY (`promotion-gate: no`): once a key is on a public commit it is already exposed;
# holding the deploy protects nothing, and a false positive would freeze prod. A red here means:
# ROTATE THE KEY FIRST (vendor dashboard -> Railway var -> redeploy), then remove it from the code.
# Team rules: C:\Users\Patrick\uct-share\PUBLIC-REPO-PLAN.md and docs/TEAM-WORKFLOW.md.
#
# Scope: only the commits this push/PR adds. History before 2026-11-08 was scanned once by hand
# and its findings were accepted; re-reporting them on every run would teach everyone to ignore red.

name: secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE}" ] && ! [[ "${PUSH_BEFORE}" =~ ^0+$ ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "scanning commit range: ${range} ($(git rev-list --count "${range}") commit(s))"
          # --redact keeps the secret out of this (public) log; the report names file, line, rule, commit.
          if ./gitleaks git . --log-opts="${range}" --redact --no-banner --report-format json --report-path leaks.json; then
            echo "no secrets in the new commits"
            exit 0
          fi
          python3 - <<'PY'
          import json
          rows = json.load(open("leaks.json"))
          print(f"::error title=Possible secret pushed::{len(rows)} finding(s). ROTATE THE KEY FIRST, then remove it. See PUBLIC-REPO-PLAN.md Part 4.")
          for r in rows:
              print(f"::error file={r['File']},line={r['StartLine']}::{r['RuleID']} in commit {r['Commit'][:10]} (value redacted)")
          PY
          exit 1
