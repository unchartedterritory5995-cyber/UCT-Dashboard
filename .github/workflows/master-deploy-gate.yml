# promotion-gate: yes — the deploy-correctness set (secret scan, shadowed definitions,
#   VITE build args, the offline flag ledger, line endings). It has no path filter on
#   master, so it runs for every candidate and its absence is a fault, not a skip.
# Serialise master deploys AT THE SOURCE, and run the fast checks while doing it.
#
# ⛔ WHY THIS EXISTS RATHER THAN A BETTER HOOK. `tools/pre_push_guard.py` already
# refuses a push while `web` is BUILDING/DEPLOYING — every state, each with a rail —
# and it still did not stop the 2026-09-14 incident: `7705c2d3b` was pushed at
# 12:29:23 UTC on a green guard and `9e2b93805` landed 173 s later while it was
# still building, marking the first REMOVED mid-flight. A request in flight died
# with a 500 after 93 s and `/api/health` served 502 for ~45 s. How it got past the
# hook was never determined; `git push --no-verify` skips hooks entirely and leaves
# no trace, and no client-side check can close that.
#
# ⭐ A CLIENT HOOK ASKS EVERY SESSION TO COOPERATE. This does not ask. GitHub queues
# runs in one concurrency group, so two pushes three minutes apart become two gate
# runs in sequence.
#
# ⚰️ THIS PARAGRAPH USED TO CONTINUE "…and Railway's 'Wait for CI' holds the build
# until the run for that commit passes". THAT IS FALSE AND WAS FALSE WHEN WRITTEN.
# Measured 2026-09-15 by reading the configuration: the toggle is the `checkSuites`
# Boolean on `Environment.deploymentTriggers`, and it is **False on all six services**.
# Railway starts building the moment the push lands, concurrently with this run.
# `promote-production.yml`'s own header said so — eight deploys that each started
# 99-141 s BEFORE their check suite finished — so two files in this directory
# contradicted each other for weeks and the wrong one was the reassuring one.
#
# ⛔ WHAT THIS GATE ACTUALLY DOES TODAY: it serialises master pushes, and its verdict
# decides whether `production` is PROMOTED.
#
# ✅ THE CUTOVER HAS HAPPENED, AND THIS PARAGRAPH USED TO SAY IT HAD NOT. Measured
# 2026-09-20 from `railway status --json`: **`web` deploys from `production`**, so a RED
# gate now DOES stop the member-facing deploy. ⚰️ The struck text read "Until the watched
# branch is repointed at `production`, a RED gate still deploys", with the `beace00e0`
# measurement from 2026-09-14T19:00:49Z behind it. That measurement was correct on the day
# and describes a world that no longer exists — kind 3b, a true record the world moved
# under.
#
# ⚠️ IT REMAINS TRUE OF THE OTHER FIVE. `worker`, `bars-api`, `chart-renderer`,
# `flow-worker` and `terminal-next-monitor` deploy from **`master`**, so they build on the
# push regardless of this gate's verdict. A red gate protects members; it does not protect
# the back end.
#
# ⛔ `cancel-in-progress: false` IS THE WHOLE MECHANISM. The default (`true`) cancels
# the older run when a newer one arrives, which is exactly backwards here: it would
# let the SECOND push through first and abandon the first — the failure this is
# built to prevent, wearing a green check.
#
# ⚠️ FAST ONLY, ON PURPOSE. Nothing here installs node, builds the frontend, or runs
# a suite that takes minutes: every second spent here is a second the next pusher
# waits. A gate that makes the queue slow gets bypassed, and a bypassed gate is
# worse than none because it reads as coverage. The heavy suites stay where they
# are (the six-shard gate, the scoped backend runs) and are the pusher's job.
#
# Measured build context: `web` builds from `Dockerfile.web` (the dashboard's
# dockerfilePath overrides railway.json's NIXPACKS — read the build log, not the
# config), and watch patterns are set per-service in the Railway dashboard.

name: master deploy gate

on:
  push:
    branches: [master, main]

# One queue for the whole repository. Runs execute strictly one at a time and an
# older run is never cancelled by a newer one.
env:
  AGENT_SHARDS: '4'
  # the UCT Agent browser suite (agent-ci.yml AGENT_VITEST_PATHS, the same list): src/agent, the builder's agentMutations,
  # and (DUP-RECEIPT 11-05, owner) the 8 page tests that drive the Agent outside src/agent
  AGENT_VITEST_PATHS: src/agent src/components/chart/builder/agentMutations src/components/chart/builder/studio/agentRoute.test.jsx src/components/StockChart.timeRangeSync.test.jsx src/pages/breadth/breadthTabHookOrder.test.jsx src/pages/charts/ChartsWorkspace.layoutUndoAgent.test.jsx src/pages/charts/ChartsWorkspace.previousLayout.test.jsx src/pages/charts/ChartsWorkspace.thisChart.test.jsx src/pages/charts/widgets/ChartWidget.agent.test.jsx src/pages/charts/widgets/TradeExchangeNewsWidget.terminal.test.jsx

concurrency:
  group: master-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: deploy-correctness checks + Agent server tests
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 40 -> 60 (2026-11-04, owner-approved): release train 2 ran the gate 35.2 of 40 min on 3d3d444d4f (Agent vitest 23.7 min, serial); 10 -> 15 (2026-10-06): + the production dependency smoke; 15 -> 25 (2026-10-11): + the UCT Agent tests (npm ci + vitest); 25 -> 40 (2026-11-02): Sprint 1 grew the Agent vitest step to 16.2 min and the gate ran 23.5 of 25 min on c3ba71c343
    steps:
      # Two commits so the secret scan has a range to look at; without this
      # `HEAD^` does not resolve and the scan silently has nothing to scan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚰️ THE FIRST RUN OF THIS GATE FAILED HERE, and the reason is worth keeping.
      # `test_visibility_flag_ledger.py` is the OFFLINE half of the flag ledger — but
      # three of its sixteen tests import `api.services.desk_daily_session` to check the
      # declared show names against the sections the router can actually emit, and that
      # module reaches httpx, numpy and Pillow. "Offline" meant "does not call Railway",
      # not "does not import the app", and I read it as the latter.
      #
      # ⛔ The alternative — deselecting those three in CI — was rejected: a gate that
      # silently skips the checks it cannot run is the opt-in-rail defect, and these are
      # exactly the ones that catch a ledger describing sections that do not exist. Three
      # wheels cost ~15 s.
      #
      # ⚠️ The coupling is real and accepted: a NEW third-party import on that path will
      # break this gate and therefore block deploys until the list is updated. That is the
      # right direction to fail — a new heavy dependency in the publish path is worth
      # stopping for — but it is a cost, not a free lunch.
      - name: Install the gate's dependencies
        run: python -m pip install --quiet pytest httpx numpy pillow pyyaml

      # ⛔⛔ COMPENSATING CONTROL — the DETECTIVE half of the protection `production`
      # does not have. Branch protection (G6) is the preventive half and is still
      # OWNER-PENDING; SD-1.2 B1.3 let the cutover proceed on this instead.
      #
      # It answers one question: is `production` where the last recorded promotion
      # left it? If somebody pushed to `production` directly, this refuses BEFORE any
      # scan runs and names the SHA and its author.
      #
      # ⛔ THREE STATES, NOT TWO — the same reason the range scan below names every state it can reach.
      # "The records disagree" and "there is no record yet" are different facts and
      # only one of them is a failure. A two-state version would either fail every run
      # before the first promotion or, far worse, read a permanently missing record as
      # agreement — a check that cannot fail, which is this repo's most-repeated bug.
      #
      # ⚠️ TWO LIMITS, STATED BECAUSE THEY ARE REAL:
      #   1. DETECTIVE, NOT PREVENTIVE. It notices a foreign push; it cannot stop one.
      #   2. Its cadence is tied to MASTER PUSHES. A foreign push to `production`
      #      during a quiet period goes unnoticed until the next master push.
      # G6 closes both. Until then this is better than nothing only because it halts
      # promotion rather than merely logging.
      - name: Production is where the last promotion left it
        run: |
          set -uo pipefail
          git fetch --no-tags --quiet --depth=1 origin "+refs/heads/deploy-gate-state:refs/remotes/origin/deploy-gate-state" 2>/dev/null || true
          CUR=$(git ls-remote origin refs/heads/production 2>/dev/null | cut -f1)
          if [ -z "$CUR" ]; then
            echo "promotion-control: NO PRODUCTION BRANCH — nothing to compare (pre-cutover)"
            exit 0
          fi
          REC=""
          if git cat-file -e origin/deploy-gate-state:last-promotion.json 2>/dev/null; then
            REC=$(git show origin/deploy-gate-state:last-promotion.json 2>/dev/null)
          fi
          if [ -z "$REC" ]; then
            echo "promotion-control: NO RECORD — nothing recorded yet; production=$CUR is NOT verified"
            exit 0
          fi
          PROMOTED=$(printf '%s' "$REC" | python -c 'import json,sys; print(json.load(sys.stdin).get("promoted_sha") or "")')
          if [ -z "$PROMOTED" ]; then
            echo "promotion-control: UNREADABLE RECORD — no promoted_sha in the record; production=$CUR is NOT verified"
            exit 0
          fi
          if [ "$PROMOTED" = "$CUR" ]; then
            echo "promotion-control: MATCH  production=$CUR"
            exit 0
          fi
          # They differ. That is NOT yet a finding: a promotion whose record-write failed,
          # and the window before the writer itself shipped, both land here legitimately.
          # The question that actually separates a promotion from a foreign push is
          # whether `production` holds something MASTER CONTAINS — a promotion only ever
          # fast-forwards to a master commit.
          git fetch --no-tags --quiet --depth=200 origin master production 2>/dev/null || true
          if ! git cat-file -e "${CUR}^{commit}" 2>/dev/null || ! git cat-file -e "${PROMOTED}^{commit}" 2>/dev/null; then
            echo "::warning title=promotion-control undecidable::production=$CUR differs from the recorded $PROMOTED and neither could be resolved in this shallow clone. NOT verified."
            echo "promotion-control: UNDECIDABLE — commits unreachable in this clone; production=$CUR is NOT verified"
            exit 0
          fi
          if git merge-base --is-ancestor "$PROMOTED" "$CUR" 2>/dev/null \
             && git merge-base --is-ancestor "$CUR" origin/master 2>/dev/null; then
            echo "::warning title=promotion record is stale::production=$CUR is ahead of the recorded $PROMOTED and is contained in master, so a promotion advanced it without recording. Not a foreign push; the next promotion re-records."
            echo "promotion-control: AHEAD-UNRECORDED  production=$CUR  recorded=$PROMOTED"
            exit 0
          fi
          WHO=$(git log -1 --format='%an <%ae>  %aI' "$CUR" 2>/dev/null || echo 'unknown — the commit could not be fetched')
          echo "promotion-control: MISMATCH  production=$CUR  recorded=$PROMOTED"
          echo "::error title=production diverged from the promotion record::production is at $CUR, which master does not contain (or which moved backwards from the recorded $PROMOTED). Author: $WHO. Nobody promoted it — halting before any scan."
          exit 1

      # ⛔ A PUSHED SECRET IS PUBLIC EVEN IF DELETED AFTERWARDS — this repo is
      # public. This is the same scanner the pre-push hook runs, here where
      # --no-verify cannot reach it.
      #
      # ⛔ `--scan` TAKES PATHS, NOT A COMMIT RANGE. The first version of this step
      # passed `HEAD^..HEAD` and the tool dutifully reported
      # "scanned 1 path(s) - 0 finding(s)" — it had scanned a filename that does not
      # exist. A secret scan that cannot fail is worse than none, because the green
      # check reads as coverage. Hence the file list AND the emptiness guard: an
      # empty result is a failed invocation until proven otherwise.
      - name: Secret scan (files this push changed)
        run: |
          # ⛔ TWO EMPTY RESULTS, TWO DIFFERENT FACTS. `--diff-filter=d` EXCLUDES
          # deletions, so a commit that only DELETES files yields an empty list while the
          # range itself is perfectly fine. The original guard could not tell that apart
          # from a broken invocation and failed BOTH — which blocked promotion on
          # 6c2c68adf, a legitimate delete-only tidy-up, holding production 6 commits
          # behind master. A check that cannot distinguish the right answer from the
          # wrong one is not a rail.
          ALL=$(git diff --name-only HEAD^ HEAD | tr '\n' ' ')
          FILES=$(git diff --name-only --diff-filter=d HEAD^ HEAD | tr '\n' ' ')
          if [ -z "$ALL" ]; then
            echo "::error::HEAD^..HEAD resolved NO paths at all — the RANGE is broken, not empty. This is the vacuous-scan case the guard exists for."
            exit 1
          fi
          if [ -z "$FILES" ]; then
            echo "this commit only DELETES paths ($ALL) — nothing readable to scan."
            echo "NOT a vacuous pass: the range RESOLVED, and a deleted file carries no"
            echo "content forward. A secret in a deleted file was already public when it"
            echo "was pushed, which is what the full-push-range step below exists for."
            exit 0
          fi
          echo "scanning: $FILES"
          python tools/secret_scrub.py --scan $FILES

      # ⛔⛔ THE STEP ABOVE SCANS ONE COMMIT, AND A PUSH IS NOT ONE COMMIT.
      #
      # `on: push` fires ONCE per push with `head_sha` = the TIP, and the scan above reads
      # `git diff HEAD^ HEAD` — the tip's own diff. Every other commit in a multi-commit
      # push is never scanned by any gating run.
      #
      # ⚰️ MEASURED 2026-09-15, not theorised. Over the 85 first-parent commits that
      # reached `production` after this gate existed, **66** had no gate run of their own.
      # Seven pushes carried more than one commit; one carried **18**, another **13**.
      # A secret in commit 3 of an 18-commit push was reviewed by nothing.
      #
      # ⭐ IT HEARTBEATS. It prints a line on EVERY run — including "nothing to scan" and
      # "clean" — because a check that speaks only when it finds something cannot be
      # distinguished from a check that never ran, and this repository has now been bitten
      # by that shape three times in one day (an empty warn log reading as zero false
      # positives; a pause logged only on change; this).
      #
      # ⛔ GATING SINCE 2026-11-06 (SD-1.1 A2.5 criterion met: 37 of the last 40 master gate
      # runs logged `EXECUTED` + `verdict=CLEAN`, 0 findings, 0 INCONCLUSIVE; the other 3 were
      # cancelled before this step). WHY IT HAD TO GATE: `master-deploy` keeps ONE pending run,
      # so a third push cancels the second's gate; the per-commit scan above then never sees
      # that commit, yet the next green tip promotes its content. The base is `production` —
      # the last promotion — so every commit about to reach production is in this diff.
      # It FAILS on a finding AND on every state that did not prove the range clean (NO
      # RANGE, INCONCLUSIVE, DIFF FAILED, SCANNER ERROR). NOTHING AHEAD and NOTHING-TO-SCAN
      # pass, because the range resolved.
      #
      # ⚠️ IT COMPARES SNAPSHOTS. A secret added in one commit and deleted by a later one in
      # the same range is not in `production..HEAD` and is not flagged here. Such a secret is
      # already public; that case belongs to the pre-push hook and to rotation, not to this gate.
      - name: Secret scan over the whole range (since production)
        run: |
          set +e
          # ⛔⛔ THE CHECKOUT ABOVE IS `fetch-depth: 2`, so `origin/production` is not in the
          # clone until fetched. `git diff BASE HEAD` compares two snapshots and needs no
          # shared history, so depth 200 is enough however far production lags.
          git fetch --no-tags --quiet --depth=200 origin production master 2>&1 | sed 's/^/range-scan fetch: /'

          # ⛔ production is the ONLY base. It has existed since the 2026-09-20 cutover. The
          # old "the push's own range" fallback is gone: falling back to it is the gap itself.
          if ! BASE_SHA=$(git rev-parse --verify --quiet refs/remotes/origin/production); then
            echo "range-scan: NO RANGE — origin/production is not in this clone (fetch failed or the ref is gone). FAILING: nothing proved this push clean."
            exit 1
          fi
          BASE=origin/production
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "range-scan: INCONCLUSIVE — base $BASE ($BASE_SHA) is not readable in this clone. FAILING: an unreadable range is not a clean one."
            exit 1
          fi
          if git merge-base --is-ancestor HEAD "$BASE" 2>/dev/null; then
            echo "range-scan: NOTHING AHEAD — HEAD is already contained in $BASE"
            exit 0
          fi

          echo "range-scan: base=$BASE head=$GITHUB_SHA"
          COMMITS=$(git rev-list --first-parent "$BASE..HEAD" 2>/dev/null | wc -l | tr -d ' ')
          # -z with quotePath off: paths with spaces or non-ASCII names reach the scanner intact.
          # git diff's OWN exit status decides, never the emptiness of its output.
          LIST=$(mktemp)
          if ! git -c core.quotePath=false diff -z --name-only --diff-filter=d "$BASE" HEAD > "$LIST"; then
            echo "range-scan: DIFF FAILED — git diff $BASE HEAD exited non-zero. FAILING: a range that could not be listed is not a clean one."
            exit 1
          fi
          mapfile -d '' PATHS < "$LIST"
          N=${#PATHS[@]}
          if [ "$N" = "0" ]; then
            echo "range-scan: EXECUTED  commits=$COMMITS  files=0  verdict=NOTHING-TO-SCAN"
            exit 0
          fi
          echo "range-scan: EXECUTED  commits=$COMMITS  files=$N"
          # The scanner silently skips a path that does not exist, so prove they all do.
          for P in "${PATHS[@]}"; do
            if [ ! -e "$P" ] && [ ! -L "$P" ]; then
              echo "range-scan: SCANNER ERROR — listed path is missing from the checkout: $P. FAILING: it would have been skipped, not scanned."
              exit 1
            fi
          done
          # Chunks keep every call under the kernel's argument limit. The scanner exits 1 on a
          # finding AND on a crash, so its summary line decides: it must report exactly the
          # paths it was given, and only a non-zero finding count is a FINDING.
          FOUND=0
          for ((i = 0; i < N; i += 400)); do
            CHUNK=("${PATHS[@]:i:400}")
            OUT=$(python tools/secret_scrub.py --scan "${CHUNK[@]}" 2>&1); RC=$?
            printf '%s\n' "$OUT" | grep -E '^LEAK ' || true
            SUMMARY=$(printf '%s\n' "$OUT" | grep -E '^scanned [0-9]+ path\(s\).* [0-9]+ finding\(s\)$' | tail -1)
            SCANNED=$(printf '%s' "$SUMMARY" | sed -E 's/^scanned ([0-9]+) path.*/\1/')
            HITS=$(printf '%s' "$SUMMARY" | sed -E 's/.* ([0-9]+) finding\(s\)$/\1/')
            if [ -z "$SUMMARY" ] || [ "$SCANNED" != "${#CHUNK[@]}" ] \
               || { [ "$RC" = 0 ] && [ "$HITS" != 0 ]; } || { [ "$RC" = 1 ] && [ "$HITS" = 0 ]; } \
               || { [ "$RC" != 0 ] && [ "$RC" != 1 ]; }; then
              echo "range-scan: SCANNER ERROR — rc=$RC paths=${#CHUNK[@]} summary='$SUMMARY'. FAILING: the scan did not provably run."
              printf '%s\n' "$OUT" | tail -5
              exit 1
            fi
            [ "$RC" = 1 ] && FOUND=1
          done
          if [ "$FOUND" = 0 ]; then
            echo "range-scan: verdict=CLEAN"
            exit 0
          fi
          echo "::error title=range-scan finding::The whole-range secret scan (production..HEAD) found something. Nothing is promoted. A pushed secret is public even if deleted: rotate it, then remove it from master. Every later push stays red until master is clean."
          echo "range-scan: verdict=FINDING"
          exit 1

      # CI COST (2026-11-06, owner): the trigger shapes that keep the Actions bill from creeping back
      # (agent-ci push paths, PR-run cancellation, the pinned unfiltered sets). ~2 s, stdlib + PyYAML.
      # + the promotion catch-up's decision (2026-11-10): the 8 cases, each with the never-master's-tip control,
      # and the promote workflow's wiring. Same step, same runner, pure functions (~1 s).
      - name: CI cost rails
        run: python -m pytest tests/test_ci_cost_rails.py tests/test_promote_decision.py -q -p no:cacheprovider

      # RAILWAY COST (2026-11-06): the memory observer's per-file page-cache probe (mincore, /proc) only runs
      # on Linux, so its tests skip on dev PCs; this is where they actually run. Stdlib only, ~1 s.
      - name: Memory observer file-cache probe (Linux)
        run: python -m pytest tests/test_mem_observe.py -k "file_cache or with_files" -q -p no:cacheprovider -rs

      # ⛔ Two top-level definitions of one name: Python keeps the last, and every
      # call site written against the first is silently running the other. Master
      # was RED on this for a shadowed `_tokens` in wisdom extraction that had been
      # rescoring similarity since c9d6af653 — found by the sweep, not by review.
      - name: No module shadows its own definitions
        run: python -m pytest tests/test_no_shadowed_definitions.py -q

      # ⛔ An undeclared VITE_* build arg bakes in as `undefined`, and every
      # `=== '1'` read then reports "off on purpose" with a green suite and a 200
      # health check. Nine of them shipped that way for four days.
      - name: Every VITE_* reaches the build and has a ledger row
        run: python -m pytest tests/test_dockerfile_vite_build_args.py tests/test_vite_flag_ledger.py -q

      # The OFFLINE half of the flag ledger. ⚠️ `tools/flag_ledger_audit.py` is the
      # live half and is deliberately NOT run here: it needs the Railway CLI and an
      # authenticated project, which CI has neither of, and a check that cannot read
      # its subject must not be able to report "clean".
      - name: Visibility flags are declared (offline)
        run: python -m pytest tests/test_visibility_flag_ledger.py -q

      # The server reads the saved-script engine number from the browser's
      # scriptEngineVersion.js. A bump written in a shape it cannot parse reads as None:
      # every recorded refusal then binds on the server while the chart moves on.
      - name: The saved-script engine number parses (offline)
        run: python -m pytest tests/test_script_engine_version_gate.py -q

      - name: Line endings match the stored blobs
        run: python tools/check_repo_hygiene.py

      # The Discord /chart, /flow and buzz replies a member gets, pinned byte-for-byte against the
      # stored golden (docs/discord-render/instruments/goldens/prev2_replies.json), plus the render
      # ops rails (smoke, /flow ledger, window buttons, pre-warm). Nothing else here exercises a
      # Discord reply, so a broken card used to reach web and be found by the post-deploy smoke or
      # by a member. ~10 s. The four extra packages are the whole import closure of these two files,
      # measured on a clean venv 2026-09-26 — NOT requirements.txt.
      # GATING since 2026-09-26. It ran advisory first, because a step failing for an environment
      # reason would halt every promotion: run 36248565296 (74bdf4f68) passed on Linux in 16 s with
      # no error annotation, and a known-failing run's `Process completed with exit code 1`
      # annotation was read as the control that the check could see a failure.
      - name: Discord render replies match the golden
        run: |
          python -m pip install --quiet fastapi tzdata matplotlib pynacl
          python -m pytest tests/test_discord_render_goldens.py tests/test_discord_render_ops.py -q

      # ⛔⛔ 2026-10-06: `jsonschema` was imported by the conversation door but absent from
      # requirements.txt. Every dev venv had it, every test passed, and THIS gate installs
      # a hand-picked list — so production's POST /api/user-definitions/converse 500'd
      # (ModuleNotFoundError) and the release was rolled back. `Dockerfile.web` builds
      # /opt/venv from requirements.txt ALONE; this step proves THAT set, in a venv of its
      # own (nothing above leaks in): the server and the conversation door import, the
      # patch validator really validates, and `uvicorn api.main:app` boots to a 200
      # /api/health with /converse refusing an anonymous caller by auth, not by 500.
      # ~2-3 min (wheels). Gating: a requirements gap is exactly what must stop promotion.
      - name: The production dependency set imports and boots the server
        run: |
          # production mounts a writable volume at /data and the app creates files there
          # at import; the runner has none (PermissionError) — provide one, as prod does
          sudo mkdir -p /data && sudo chown "$(id -u):$(id -g)" /data
          python -m venv /tmp/prodvenv
          /tmp/prodvenv/bin/python -m pip install --quiet --upgrade pip
          /tmp/prodvenv/bin/python -m pip install --quiet -r requirements.txt
          /tmp/prodvenv/bin/python -I tools/prod_dependency_smoke.py

      # ── UCT AGENT (2026-10-11) ────────────────────────────────────────────────────
      # The p25 Agent release reached production with NO Agent test in this gate (it ran
      # none; the report-only full suite was cancelled / pending). These two steps run the
      # Agent's own suites on every push: the server half against the PRODUCTION dependency
      # set built just above, the browser half (planner, composer, runtime, approvals,
      # receipts, Undo, the scripted 24-task evaluation) under vitest. The model is never
      # called — every Agent test scripts it; this job holds no key.
      # ⛔ NEVER SKIPPED: no `if:`, no continue-on-error, no path filter, no
      # --passWithNoTests. A renamed or emptied suite FAILS: the pytest glob matches nothing
      # (exit 4), and the browser step refuses a suite smaller than its floor.
      # tests/test_uct_agent_deploy_gate.py rails all of this (and runs inside the glob).
      - name: UCT Agent server tests (production dependency set)
        run: |
          /tmp/prodvenv/bin/python -m pip install --quiet pytest httpx
          /tmp/prodvenv/bin/python -m pytest tests/test_uct_agent*.py -q -p no:cacheprovider


      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The master deploy gate failed — Railway has ALREADY built this commit; production will not be promoted."
          echo ""
          echo "⛔ READ THAT AGAIN: a red gate does NOT stop the deploy today."
          echo "Railway's Wait-for-CI is OFF (checkSuites=False on all six services),"
          echo "so the build started when you pushed. What this failure prevents is the"
          echo "promotion of \`production\`. Until the watched branch is repointed at"
          echo "\`production\`, the code IS live and a revert is a push, not a re-run."
          echo ""
          echo "This gate is FAST and serialised: it holds the promotion queue, so fix"
          echo "forward rather than pushing again on top of a red run."
          echo ""
          echo "Run the same checks locally:"
          echo "  python tools/secret_scrub.py --scan $(git diff --name-only --diff-filter=d HEAD^ HEAD)"
          echo "  git -c core.quotePath=false diff -z --name-only --diff-filter=d origin/production HEAD | xargs -0 python tools/secret_scrub.py --scan   # the range scan"
          echo "  python -m pytest tests/test_no_shadowed_definitions.py -q"
          echo "  python -m pytest tests/test_dockerfile_vite_build_args.py tests/test_vite_flag_ledger.py -q"
          echo "  python -m pytest tests/test_visibility_flag_ledger.py -q"
          echo "  python tools/check_repo_hygiene.py"
          echo "  python -m pytest tests/test_discord_render_goldens.py tests/test_discord_render_ops.py -q"
          echo "  python -m venv /tmp/prodvenv && /tmp/prodvenv/bin/pip install -r requirements.txt && /tmp/prodvenv/bin/python -I tools/prod_dependency_smoke.py"
          echo "  python -m pytest tests/test_uct_agent*.py -q"
          echo "  (cd app && npm ci && npx vitest run $AGENT_VITEST_PATHS)  # CI runs this as 4 shards + an equivalence rail"

  # ── SPEEDUP (2026-11-04): the Agent browser suite was 22.3 of the gate's ~31 min, run
  # serially AFTER the Python checks. It now runs as 4 parallel vitest shards beside the
  # `gate` job, exactly as agent-ci.yml already does, and `agent-browser-union` proves the
  # shards together executed EVERY file `vitest list` reports (the equivalence rail) with
  # zero failures and >= 30 files. Nothing is skipped, deselected or made optional.
  # ⛔ The workflow conclusion (what promote-production.yml / tools/promotion_gate.py read)
  # is failure if ANY job fails; `verdict` additionally names the result in one place.
  agent-browser:
    name: UCT Agent browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies (for the UCT Agent browser tests)
        working-directory: app
        run: npm ci

      - name: UCT Agent browser tests
        working-directory: app
        run: |
          n=$(ls src/agent/*.test.js src/agent/*.test.jsx 2>/dev/null | wc -l)
          if [ "$n" -lt 30 ]; then
            echo "::error::Only $n UCT Agent test files under app/src/agent (floor 30) — refusing to pass a gate that tests nothing."
            exit 1
          fi
          start=$(date +%s)
          npx vitest run $AGENT_VITEST_PATHS             --shard=${{ matrix.shard }}/${AGENT_SHARDS}             --reporter=default --reporter=json --outputFile=../shard-${{ matrix.shard }}.json
          echo "shard ${{ matrix.shard }} wall: $(( $(date +%s) - start )) s"

      - name: Keep the shard report for the equivalence rail
        uses: actions/upload-artifact@v4
        with:
          name: gate-agent-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error

  agent-browser-union:
    name: Agent shards cover every Agent test file (equivalence rail)
    needs: agent-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci (for vitest list)
        working-directory: app
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-agent-shard-*
          path: shards
          merge-multiple: true
      - name: Expected file list
        working-directory: app
        run: npx vitest list $AGENT_VITEST_PATHS --filesOnly > ../expected-files.txt && wc -l ../expected-files.txt
      - name: Union of executed files equals the expected list; exactly 4 shard reports; floor 30; no failures
        run: |
          node - <<'EOF2'
          const fs = require('fs'), path = require('path');
          const norm = p => path.resolve(p).replace(/\\/g, '/').replace(/^.*?\/app\//, 'app/');
          const expected = new Set(fs.readFileSync('expected-files.txt', 'utf8').split(/\r?\n/).filter(Boolean).map(f => norm(path.join('app', f))));
          const reports = fs.readdirSync('shards').filter(f => f.endsWith('.json'));
          if (reports.length !== Number(process.env.AGENT_SHARDS)) { console.log(`::error::expected ${process.env.AGENT_SHARDS} shard reports, got ${reports.length}`); process.exit(1); }
          const ran = new Set(); let failed = 0, passed = 0, files = 0;
          for (const f of reports) {
            const r = JSON.parse(fs.readFileSync(path.join('shards', f), 'utf8'));
            for (const t of r.testResults) { files++; ran.add(norm(t.name)); }
            failed += (r.numFailedTests || 0) + (r.numFailedTestSuites || 0); passed += r.numPassedTests || 0;
          }
          const missing = [...expected].filter(f => !ran.has(f));
          const extra = [...ran].filter(f => !expected.has(f));
          console.log(`expected ${expected.size} files; shards ran ${ran.size} distinct (${files} total); passed ${passed}, failed ${failed}`);
          if (missing.length) { console.log('::error::files no shard ran:\n' + missing.join('\n')); }
          if (extra.length) { console.log('::warning::files ran but not in the expected list:\n' + extra.join('\n')); }
          if (expected.size < 30 || ran.size < 30) { console.log('::error::fewer than 30 Agent test files'); process.exit(1); }
          if (missing.length || failed > 0) process.exit(1);
          EOF2

  # ── PINE RUNTIME SERVICE (W5-T19, 2026-11-04) ──────────────────────────────────
  # docs/pine/SERVER-RUNTIME-DESIGN.md section 8, steps 1-7, as its OWN job beside `gate`
  # (own checkout, Python, Node and `npm ci`, as the agent-browser shards have), and named in
  # `verdict.needs`. Every step is offline and cheap. Runbook: docs/runbooks/pine-runtime-service.md.
  # ⛔ NEVER SKIPPED: no conditional, no optional-failure flag, no path filter. A step that cannot
  # find its subject FAILS (node and pytest both exit non-zero on a missing file).
  # tests/test_pine_runtime_deploy_gate.py rails all of this: the steps, their order, that the Node
  # here is the image's Node, that the job is in verdict.needs, and that every
  # tests/test_pine_runtime_*.py is named by a step.
  # NOT here, on purpose: the Chromium half of host parity (HP-2/HP-3) and the C18 diff count run
  # before merge under the coordinator's lock (too heavy for a gate); the post-deploy smoke needs
  # the live service. The image is not built here: section 8 does not ask for it.
  pine-runtime:
    name: Pine runtime service rails (section 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies (for the Pine runtime bundle)
        working-directory: app
        run: npm ci

      # The production dependency set, as `gate` builds it: the client and codec rails import the
      # app's own modules, so they run on what production runs.
      - name: Pine runtime - the production dependency set
        run: |
          python -m venv /tmp/prodvenv
          /tmp/prodvenv/bin/python -m pip install --quiet --upgrade pip
          /tmp/prodvenv/bin/python -m pip install --quiet -r requirements.txt
          /tmp/prodvenv/bin/python -m pip install --quiet pytest httpx

      # The Node on this runner must be the image's Node, READ from the image, not retyped: the
      # setup-node pin above is a major number, so this step compares it with the FROM line of
      # services/pine_runtime/Dockerfile (a separate rail pins that line to Dockerfile.web's).
      - name: Pine runtime - this runner's Node is the image's Node
        run: |
          want=$(sed -n 's/^FROM node:\([0-9][0-9]*\)\..*/\1/p' services/pine_runtime/Dockerfile | head -n 1)
          have=$(node -p 'process.versions.node.split(".")[0]')
          echo "image Node major: ${want:-none}; runner Node: $(node -v) (V8 $(node -p 'process.versions.v8'))"
          test -n "$want" && test "$want" = "$have"

      # 1. The server bundle builds, and imports under bare Node.
      - name: Pine runtime - the server bundle builds and imports under bare Node
        working-directory: app
        run: |
          node scripts/build-pine-runtime.mjs
          node -e "import('./dist-server/pine-runtime.mjs').then(() => console.log('bundle imports'))"

      # 2. Host parity, Node half: HP-1 (committed digests) + HP-4 (the perturbed bundle must go
      # red) + HP-5. A digest change without an engine bump is red. ⚠️ This runner's V8 (Node 20 =
      # V8 11.3) is NOT the V8 the digests were recorded on (13.6): on a different V8 the tool
      # reports exactly the two NAMED trig cases in corpus.json `reportOnly` (V8 sin/cos 1 ulp)
      # and gates the other 164. On the recording V8 all 166 are gated. Exit 2 (inconclusive) fails.
      - name: Pine runtime - host parity, Node half (HP-1, HP-4 control, HP-5)
        run: |
          node tools/pine_runtime_host_parity.mjs --host node --check
          node tools/pine_runtime_host_parity.mjs --host node --mutation-control

      # 3. Engine identity agrees (HP-6) and the adapters agree (HP-7).
      - name: Pine runtime - engine identity and adapters agree (HP-6, HP-7)
        run: /tmp/prodvenv/bin/python -m pytest tests/test_pine_runtime_engine_identity.py -q -p no:cacheprovider

      # 4. Closure stays host-neutral (W5-T2's tools/pine_runtime_closure.mjs; exits 1 on any finding).
      # ⚠️ The tool arrives with W5-T2: this step is red on any tree without it, so T2 MUST merge before
      # (or with) this workflow. That is deliberate: a step that skipped a missing tool would be a rail that
      # reads green while checking nothing.
      - name: Pine runtime - the closure stays host-neutral
        run: node tools/pine_runtime_closure.mjs --check

      # 5. Service unit rails: protocol, auth, sandbox, pool, hostile corpus (and caches, canary,
      # metrics when they land: the glob takes every *.test.mjs).
      - name: Pine runtime - service unit rails
        run: node --test services/pine_runtime/test/*.test.mjs

      # 6. The client, the codec, the stamps, the stop telemetry and the composition matrix (W5-T17:
      # merge order T17 before T19), and this gate's own rail.
      - name: Pine runtime - client, codec and composition rails
        run: |
          /tmp/prodvenv/bin/python -m pytest tests/test_pine_runtime_client.py tests/test_pine_runtime_codec.py tests/test_pine_runtime_composition.py tests/test_pine_runtime_deploy_gate.py tests/test_pine_runtime_result_integrity.py tests/test_pine_runtime_service_smoke.py tests/test_pine_runtime_shared_stamp.py tests/test_pine_runtime_stop_telemetry.py tests/test_pine_runtime_switch_on.py -q -p no:cacheprovider

      # 7. Dockerfile agreement: the image's Node pin and VITE_* set equal Dockerfile.web's.
      - name: Pine runtime - the image agrees with Dockerfile.web
        run: /tmp/prodvenv/bin/python -m pytest tests/test_pine_runtime_dockerfile.py -q -p no:cacheprovider

  # One named verdict for the whole gate. Runs even when a dependency failed or was
  # cancelled, and passes ONLY if every job above succeeded.
  verdict:
    name: master deploy gate verdict
    needs: [gate, agent-browser, agent-browser-union, pine-runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate job succeeded
        run: |
          echo "gate=${{ needs.gate.result }} agent-browser=${{ needs.agent-browser.result }} union=${{ needs.agent-browser-union.result }} pine-runtime=${{ needs.pine-runtime.result }}"
          if [ "${{ needs.gate.result }}" = success ] && [ "${{ needs.agent-browser.result }}" = success ] && [ "${{ needs.agent-browser-union.result }}" = success ] && [ "${{ needs.pine-runtime.result }}" = success ]; then
            echo "master deploy gate: ALL JOBS GREEN"; exit 0
          fi
          exit 1

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The master deploy gate failed — Railway has ALREADY built this commit; production will not be promoted."
          echo ""
          echo "⛔ READ THAT AGAIN: a red gate does NOT stop the deploy today."
          echo "Railway's Wait-for-CI is OFF (checkSuites=False on all six services),"
          echo "so the build started when you pushed. What this failure prevents is the"
          echo "promotion of \`production\`. Until the watched branch is repointed at"
          echo "\`production\`, the code IS live and a revert is a push, not a re-run."
          echo ""
          echo "This gate is FAST and serialised: it holds the promotion queue, so fix"
          echo "forward rather than pushing again on top of a red run."
          echo ""
          echo "Run the same checks locally:"
          echo "  python tools/secret_scrub.py --scan $(git diff --name-only --diff-filter=d HEAD^ HEAD)"
          echo "  git -c core.quotePath=false diff -z --name-only --diff-filter=d origin/production HEAD | xargs -0 python tools/secret_scrub.py --scan   # the range scan"
          echo "  python -m pytest tests/test_no_shadowed_definitions.py -q"
          echo "  python -m pytest tests/test_dockerfile_vite_build_args.py tests/test_vite_flag_ledger.py -q"
          echo "  python -m pytest tests/test_visibility_flag_ledger.py -q"
          echo "  python tools/check_repo_hygiene.py"
          echo "  python -m pytest tests/test_discord_render_goldens.py tests/test_discord_render_ops.py -q"
          echo "  python -m venv /tmp/prodvenv && /tmp/prodvenv/bin/pip install -r requirements.txt && /tmp/prodvenv/bin/python -I tools/prod_dependency_smoke.py"
          echo "  python -m pytest tests/test_uct_agent*.py -q"
          echo "  (cd app && npm ci && npx vitest run $AGENT_VITEST_PATHS)  # CI runs this as 4 shards + an equivalence rail"
