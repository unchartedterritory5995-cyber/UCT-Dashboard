# promotion-gate: yes — ruling R-10 (wave 10): "gate the byte budget in CI now". The byte
#   check is DETERMINISTIC -- it sums the Notebook route's static JS closure out of the Vite
#   build manifest against a hand-edited budget -- so a red here is a real regression, never
#   runner noise, and it may hold `web` back. Moved out of notebook-budgets.yml (which stays
#   ADVISORY for its millisecond readings) because the gate is decided per workflow FILE
#   (tools/promotion_gate.py) and the two could not share one marker. Wave 10, lane 10A.
#   Held to the D-A2 standard in fix round 1 (review M-3):
#   SEEN GREEN https://github.com/unchartedterritory5995-cyber/UCT-Dashboard/actions/runs/36328815419
#     (feat/notebook-w10-a 8e4b51a0c: 2,205,893 B of JS against the 2,260,793 B budget)
#   SEEN RED   https://github.com/unchartedterritory5995-cyber/UCT-Dashboard/actions/runs/36345075379
#     (throwaway ci/notebook-w10a-bytes-red a27769fee = 90dbfc0f0 with the budget set to
#     1,000,000 B: "BREACH bytes.notebook_first_open: 2,205,893 B > budget 1,000,000 B")
#
# ⛔ A RED HERE ON A MASTER COMMIT REFUSES PROMOTION (tools/promotion_gate.py), AND NOTHING
#   RETRIES IT. promote-production.yml reads this job's verdict when "master deploy gate"
#   completes and refuses -- so that commit (a Notebook revert-and-push rollback included)
#   sits unpromoted until somebody acts:
#     * ANY growth of the Notebook route's first-open JS past the budget -- from a change
#       anywhere in the app that lands in the entry chunk, not only a Notebook one -- REFUSES
#       promotion until docs/notebook/perf-budgets.json is edited BY HAND, with its reason
#       (perf-budgets.md). Headroom at 8e4b51a0c: 54,900 B (2.4 %). Never raise the budget to
#       fit a reading; shrink the chunk, or record why the growth is paid for.
#     * An INFRASTRUCTURE failure (`npm ci`, the build, a runner) refuses too, and says
#       nothing about the code.
#       Recovery is a re-run: `gh run rerun <run-id> --failed` (or Actions -> "notebook bytes" ->
#       the red run -> "Re-run failed jobs"), then, once green, promote that commit by hand
#       -- a re-run alone does not re-trigger promotion:
#         gh workflow run promote-production.yml -f sha=<the master commit sha>
#       A red that reproduces on the re-run is not infrastructure: read the step's output.
#   (Fix round 1, review M-3; the same two steps as notebook-a11y.yml's recovery.)
# ─── NOTEBOOK JS BYTE BUDGET, IN CI (GATING) ─────────────────────────────────
#
# The JS a browser fetches before the Notebook route renders: the entry plus every chunk in
# the STATIC import closure of the route's lazy roots in the Vite build manifest
# (`build.manifest: true` in app/vite.config.js), derived from the graph on every run and
# never a hand-typed chunk list. Budget and baseline: `docs/notebook/perf-budgets.json`
# (edited BY HAND), `bytes.notebook_first_open`. The ONE checker is
# `tools/notebook_perf_budgets.py`, the same one the advisory workflow used.
#
# ⛔ A MISSING MANIFEST OR A RENAMED ROUTE ROOT EXITS 3 AND FAILS THE JOB (closed). A budget
#   that could not be checked did not pass.
name: notebook bytes

on:
  # 2026-10-19: push runs on master only. The repo is private now and Actions minutes cost money;
  # a branch push used to run this AND its pull_request run, i.e. the same check twice.
  push:
    branches: [master]
    paths:
      - 'app/src/**'
      - 'app/vite.config.js'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'tools/notebook_perf_budgets.py'
      - 'docs/notebook/perf-budgets.json'
      - '.github/workflows/notebook-bytes.yml'
  # REQUIRED CHECK (2026-11-10): no `paths:` here. Every PR runs this workflow, so its
  # "notebook bytes (required)" check always reports; the `changes` job decides whether the real jobs must run, by
  # matching the PR diff against on.push.paths above (the single list). See tools/ci_paths_match.py.
  # No `branches:` either, as before: PRs into any base keep running this (agent/int included).
  pull_request:

# CI COST (2026-11-06, owner): a newer push to the same PR cancels that PR's older run of this
# workflow. Every other event (master push, dispatch, schedule) is grouped by its own commit SHA and
# is never cancelled: promotion reads the master runs for a SHA. tests/test_ci_cost_rails.py pins this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # REQUIRED CHECK: is this run relevant? On a PR, the diff against on.push.paths (plus this file and
  # tools/ci_paths_match.py); on any other event, always. ANY error in the matcher means relevant=true.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (a failure here only makes the run relevant)
        continue-on-error: true
        run: python -m pip install --quiet 'PyYAML>=6.0'
      - name: Match the PR diff against on.push.paths
        id: match
        env:
          WORKFLOW_FILE: .github/workflows/notebook-bytes.yml
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.base_ref }}
          SAME_REPO_PR_BASES: ''
        run: |
          relevant=true
          if python tools/ci_paths_match.py match --workflow "$WORKFLOW_FILE" --event "$EVENT" \
               --base "$BASE_SHA" --head "$HEAD_SHA" --repo-name "$REPO" --head-repo "$HEAD_REPO" \
               --base-ref "$BASE_REF" --same-repo-pr-bases "$SAME_REPO_PR_BASES" > decision.txt; then
            if grep -qx 'relevant=false' decision.txt; then relevant=false; fi
          fi
          cat decision.txt || true
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "decision: relevant=$relevant"

  bytes:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build (writes dist/.vite/manifest.json)
        working-directory: app
        # 2026-10-19: the build died with "JavaScript heap out of memory" (exit 134) once the repo went
        # private and its runners got less RAM, which shrank Node's default heap. Pin it explicitly.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib only: the byte check reads the manifest and the files beside it.
      - name: Notebook JS byte budget
        run: python tools/notebook_perf_budgets.py --dist app/dist

  # THE REQUIRED CHECK (the branch ruleset requires "notebook bytes (required)"). `if: always()` so it reports on every
  # run; `needs` lists EVERY other job (tests/test_ci_cost_rails.py holds both). It passes when the change
  # is not relevant here, otherwise only when every needed job ended `success`: skipped, cancelled,
  # neutral or missing is a FAIL (tools/ci_paths_match.py verdict).
  required:
    name: notebook bytes (required)
    needs: [changes, bytes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Every needed job succeeded, or the change is not relevant here
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_paths_match.py verdict --expect changes,bytes
