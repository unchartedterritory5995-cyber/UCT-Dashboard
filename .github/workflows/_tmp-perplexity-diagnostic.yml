# TEMPORARY, one-off diagnostic — not part of the Perplexity cost-spike fix.
# Manual-trigger only (workflow_dispatch), read-only (GET requests to public
# endpoints only, no credentials). Run from GitHub's own runners because the
# authoring sandbox's network egress is blocked to this domain. Deleted after
# use — see PR #99 discussion for context.
name: Perplexity spike diagnostic (temporary)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/_tmp-perplexity-diagnostic.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public health + readiness probes
        run: |
          echo "=== GET /api/health (no auth; uptime_seconds/thread_count/rss_mb) ==="
          curl -sS -m 10 https://uctintelligence.com/api/health
          echo ""
          echo ""
          echo "=== GET /api/ready (no auth; readiness.snapshot()) ==="
          curl -sS -m 10 https://uctintelligence.com/api/ready
          echo ""
          echo ""
          echo "=== admin endpoints — expect 401/403 (confirms gated, not broken) ==="
          curl -sS -m 10 -o /dev/null -w "GET /api/admin/catalyst-stats -> HTTP %{http_code}\n" https://uctintelligence.com/api/admin/catalyst-stats
          curl -sS -m 10 -o /dev/null -w "GET /api/ai-search/admin/stats -> HTTP %{http_code}\n" https://uctintelligence.com/api/ai-search/admin/stats
