# promotion-gate: no — ADVISORY, PR-only. It never runs on a master push; the master deploy gate runs the same list.
# ─── THE ENGINE'S WHOLE-APP RAILS, ON EVERY PR THAT CAN BREAK THEM ─────────────────────────────────────────────
#
# ⚰️ WHY (2026-11-17). Some tests under app/src/components/chart/engine/ read files OUTSIDE the engine:
# memberPaneGate walks the import graph from src/main.jsx; suiteCoverage lists the test folders under
# components/chart; three source rails import StockChart.jsx as text. They ran only in pine heavy, which triggers
# on engine paths, so #1662 (pages/formulas/deviceDrawTime.js) and #1670 (builder/inspect) merged green while
# breaking memberPaneGate and suiteCoverage, and the NEXT engine PRs (#1672, #1677) went red on someone else's
# change. Widening pine heavy's trigger to app/src/** would buy this at ~100 runner-minutes a PR (half of all
# runner minutes already); this job runs ONLY those rails, on one runner, in a few minutes.
#
# ⭐ MEASURED, NOT GUESSED (2026-11-17): a read capture over all 1,137 engine test files found 311 that read outside
# the engine. 240 read only Pine fixtures, Pine docs and Pine tool outputs: those paths became pine heavy TRIGGERS
# (a Pine fixture change is Pine work). The other 71 read the app (and, for the walkers, api/, services/, tools/
# and tests/fixtures/): they are this job's list (68 after api/services/bars_window.py, read by the strategy lane,
# became a pine heavy trigger), and every path they read is in `paths:` below. So this job triggers on most PRs;
# it is the cheap one (~68 files, ~100 s of tests on 2 workers, ~3 min of job).
#
# ⛔ THE LIST IS DERIVED, NOT HAND-KEPT ALONE: tools/whole_app_engine_rails.txt. Every pine heavy run records
# which files each engine test file reads (app/src/test-read-capture.cjs) and `union` fails when a test that reads
# outside pine heavy's trigger paths is missing from the list, when a listed file no longer does, or when one of
# those reads is outside this file's `paths:` below (tools/ci_whole_app_rails.py). So a NEW whole-app rail goes
# red on the engine PR that adds it, never on a stranger's PR later. This job runs the list WITH the capture on,
# and runs the same check over what it captured: every listed file must still read outside the engine, and every
# path it reads must trigger this job.
#
# Runs in pine heavy's environment (its setup action: Node 20, cached node_modules, EMPTY licence-held stores,
# the no-network wrapper), so a rail answers here exactly as it does there.
#
# ⚰️ THE SAME HOLE, IN PYTEST (2026-11-19). #1998 changed only app/src, all 52 of its PR checks were green, and master
# went red on tests/test_support_loop_refusal_codes.py: a pytest rail that READS app/src, which no PR job ran. The
# `app-src-pytest` job (four shards) runs every pytest file under tests/ that reads app/src and that no other PR job
# already runs under a trigger covering what it reads. The list is DERIVED (tools/ci_app_src_rails.py), never
# hand-kept, and tests/test_ci_app_src_rails.py (in `rails`) fails when an app/src reader runs on no PR and is not on
# that tool's reasoned EXEMPT list.
# No secrets, no pull_request_target, read-only token. tests/test_ci_whole_app_rails.py and
# tests/test_ci_app_src_rails.py rail this file.
name: whole-app engine rails (PR)

on:
  pull_request:
    branches: [master]
    paths:
      # every path a listed rail reads that pine heavy's trigger does not cover (tools/ci_whole_app_rails.py
      # --check fails when one is missing here)
      # (whole trees where a rail WALKS one: memberPaneGate the app's import graph, minContractLock app/src,
      # api/, services/ and tools/, manifestProse and enumerationSites api/, i6aN4BlockIndent tests/fixtures/)
      - 'app/**'
      - 'api/**'
      - 'services/**'
      - 'tools/**'
      - 'docs/decisions/**'
      - 'docs/superpowers/**'
      - 'docs/frontend_feature_flags.json'
      - 'docs/pine/lwc5-capability-map.md'
      - 'tests/fixtures/**'
      - 'tests/test_the_member_loop_end_to_end.py'
      # this job's own definition and tooling (tools/ci_app_src_rails.py is under tools/** above)
      - '.github/workflows/whole-app-engine-rails.yml'
      - '.github/actions/pine-heavy-setup/**'
      - 'tests/test_ci_whole_app_rails.py'
      - 'tests/test_ci_app_src_rails.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # ⛔ the out-of-git stores, pinned to directories the setup action creates EMPTY (and refuses if not), as pine heavy
  UCT_VENDOR_CAPTURE_STORE: /tmp/pine-heavy-empty-store/captures
  UCT_HARNESS_SUPPLY_STORE: /tmp/pine-heavy-empty-store/supply
  CI_TOOLS: .pine-heavy-ci
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  rails:
    name: whole-app engine rails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history: listed rails read StockChart.jsx at an older commit (`git show <sha>:...`, e.g.
          # enumerationSites, legendFromDefinitions), which a depth-1 checkout cannot answer. Depth 1 is allowed
          # only while no listed rail reads history: tests/test_ci_whole_app_rails.py derives the readers.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: ${{ env.CI_TOOLS }}
          sparse-checkout: |
            .github/actions
            tools
      - uses: ./.pine-heavy-ci/.github/actions/pine-heavy-setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The rails of this file and its tools
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest tests/test_ci_whole_app_rails.py tests/test_ci_app_src_rails.py -q -p no:cacheprovider
      - name: The list names real engine test files, once each
        run: python tools/ci_whole_app_rails.py --verify-list
      - name: The whole-app rails (offline, read capture on)
        working-directory: app
        run: |
          set -euo pipefail
          files="$(python ../tools/ci_whole_app_rails.py --print-list)"
          echo "$files"
          start=$(date +%s); rc=0
          # shellcheck disable=SC2086
          UCT_READ_CAPTURE_DIR="$GITHUB_WORKSPACE/read-capture" bash "../$CI_TOOLS/tools/ci_offline.sh" npx vitest run $files --maxWorkers=2 \
            --reporter=default --reporter=json --outputFile=../whole-app-out/report.json || rc=$?
          echo "whole-app engine rails wall: $(( $(date +%s) - start )) s (exit $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Every listed file ran, still reads outside the engine, and every path it reads triggers this job
        if: always()
        run: |
          python tools/ci_whole_app_rails.py --ran whole-app-out/report.json
          python tools/ci_whole_app_rails.py --check --expected-list --captures read-capture --report whole-app-out/reads.json
      # #1998's miss as the command that names it in seconds (tools/ci_app_src_rails.py TOOL_CHECKS): a refusal-guard
      # literal written in app/src that supportLoop/refusalCodes.json lacks, so the server would store it as
      # `_unlisted`. Stdlib only, under the no-network wrapper; `!cancelled()` so a red vitest rail above cannot hide it.
      - name: The refusal codes the client writes are on the list the server stores
        if: ${{ !cancelled() }}
        run: bash "$CI_TOOLS/tools/ci_offline.sh" python tools/support_loop/refusal_codes.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-app-engine-rails
          path: whole-app-out/
          if-no-files-found: warn

  # ── THE APP/SRC PYTEST RAILS (2026-11-19) ──────────────────────────────────────────────────────────────────
  # #1998 (a browser-only change) added a refusal-guard literal to builder/runsHere.js without registering it in
  # supportLoop/refusalCodes.json; its 52 PR checks were green and master went red on
  # tests/test_support_loop_refusal_codes.py, a PYTEST rail that READS app/src and that no PR job ran. This job runs
  # every such rail on the PR: tools/ci_app_src_rails.py derives them (static, over the AST) and lists the ones no
  # other PR job already runs under a trigger covering what they read, minus its reasoned EXEMPT and the KNOWN_RED
  # tests it deselects by id. A new app/src rail joins the list the day it lands, with nothing to edit.
  # ITS OWN JOB, SHARDED, because the list is ~20 min of tests on one runner (measured on the remote tests lane,
  # 2026-11-19): four shards of equal recorded time (tools/pytest_shard_timings.json), one partition computed the
  # same way by every shard. Installed as `remote tests` installs (the production set + the CI-only packages), in pine
  # heavy's environment, every test under the no-network wrapper. The `rails` job above runs
  # tests/test_ci_app_src_rails.py, which recomputes the census and fails when a reader runs on no PR.
  app-src-pytest:
    name: app/src pytest rails (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, as the remote tests lane checks out: listed rails read git objects and older commits, and
          # under the no-network wrapper a partial clone could not fetch a missing object on demand.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: ${{ env.CI_TOOLS }}
          sparse-checkout: |
            .github/actions
            tools
      - uses: ./.pine-heavy-ci/.github/actions/pine-heavy-setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: The production dependency set and the CI-only packages (as remote tests installs them)
        run: |
          sudo mkdir -p /data && sudo chown "$(id -u):$(id -g)" /data
          python -m pip install --quiet -r requirements.txt pytest httpx pyyaml
          if [ -f tests/ci-only-packages.txt ]; then python -m pip install --quiet -r tests/ci-only-packages.txt; fi
      - name: The app/src pytest rails, this shard (tools/ci_app_src_rails.py --write-args)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python tools/ci_app_src_rails.py --write-args app-src-args.txt --shard "$SHARD/4"
          mapfile -t args < app-src-args.txt
          test "${#args[@]}" -gt 0
          start=$(date +%s); rc=0
          bash "$CI_TOOLS/tools/ci_offline.sh" python -m pytest "${args[@]}" -q -p no:cacheprovider -rfE || rc=$?
          echo "app/src pytest rails, shard $SHARD/4: ${#args[@]} args, wall $(( $(date +%s) - start )) s (exit $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
