# promotion-gate: no — ADDITIVE CI for the Agent program's branches (agent/**, PRs into
#   agent/int and master from them). It never decides promotion: the master deploy gate keeps
#   every Agent step it has today, and tools/promotion_gate.py classifies this file as "no".
#   Owner-approved 2026-11-02: tests/test_uct_agent_deploy_gate.py::test_no_OTHER_workflow_is_an_agent_gate
#   exempts promotion-gate:no workflows (pinned by name) and keeps refusing any gating or
#   unclassified workflow that names the Agent suites; the gate's own Agent steps stay mandatory.
# UCT Agent CI — the Agent program's own integration check (Wave 1, 2026-11-02).
#
# ADDITIVE. This does not change the master deploy gate; the gate keeps every step it has
# today. This runs the Agent suites where they belong — on every push to an Agent branch and
# on every PR into agent/int or master from one — so breakage is visible BEFORE a release
# candidate reaches the serial gate, and so the suites can be sharded in parallel.
#
# Coverage equivalence is a rail, not a promise: the `union` job fails unless the set of test
# files the AGENT_SHARDS shards executed equals the set `vitest list` reports for the same paths, and
# unless the file count clears the same floor the gate uses (30). Since 2026-11-15 (owner D27 #2)
# it also fails if any file ran in more than one shard.
#
# MERGE-TREE EVIDENCE (P2, 2026-11-17; inert until merged, activation = AUDIT T2 + owner): a same-repo agent/** PR into
# MASTER now also runs every job on its pull_request event, i.e. on refs/pull/N/merge (the tree a merge would land), not
# only on the branch head's push run (the head on its OLD base). PRs into agent/int keep skipping (push evidence only).
# Each required job uploads `agent-ci-evidence-pr<N>-<job key>` (merge commit, its tree, base + head parents, the failed
# test names per suite); tools/agent_ci_evidence.py verify turns them into PASS/FAIL for one PR + one expected tree.
# A PR that edits what its own run executes (this file, tools/agent_ci_*.py, test config, deps) never passes on it:
# verify answers `self-protected-diff` and AUDIT's local evidence decides (AUDIT F1).
# workflow_dispatch (pr + merge_sha) is the RE-ARM for one named PR after master moved: tools/agent_ci_rearm.py waits
# for GitHub's merge ref to be current, then dispatches once; every job checks out that exact merge commit.
# Push runs are unchanged: every added step is `github.event_name != 'push'`, the checkout `ref:` is empty on push,
# and the push concurrency group is the same string as before (rails: tests/test_ci_agent_merge_ref.py).
name: agent ci

on:
  # CI COST (2026-11-06, owner): push runs take the SAME paths list as the PR trigger below
  # (tests/test_ci_cost_rails.py holds the two lists equal). Before this, every push to any
  # agent/** branch ran the full ~76-minute suite even for a docs-only commit: 552 of 789 runs
  # on 11-01..11-06 were pushes, ~70% of the month's Actions bill. The master deploy gate
  # still runs the whole Agent suite on every master push, unfiltered.
  # (2026-11-12, agent-ci-required, AUDIT option B): a same-repo PR whose head is NOT under agent/** runs the Agent jobs on its
  # pull_request event (the jobs' if: … || !startsWith(github.head_ref, 'agent/')). The PR trigger's paths: filter reads the PR's
  # OWN diff, so a branch that only merges master never pays; agent/** heads keep the push-run evidence below.
  push:
    branches: ['agent/**']
    paths:
      - 'app/src/agent/**'
      - 'app/src/components/chart/builder/agent*'
      # DUP-RECEIPT (11-05, owner): the page tests that DRIVE the Agent (AgentPanel / useAgent on the real workspace) and
      # the page code they exercise — a regression there was invisible to Agent CI (only the nightly report-only suite ran it)
      - 'app/src/pages/charts/ChartsWorkspace.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.thisChart.test.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.layoutUndoAgent.test.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.previousLayout.test.jsx'
      - 'app/src/pages/charts/widgets/ChartWidget.agent.test.jsx'
      - 'app/src/pages/charts/widgets/TradeExchangeNewsWidget.terminal.test.jsx'
      - 'app/src/pages/breadth/breadthTabHookOrder.test.jsx'
      - 'app/src/components/chart/builder/studio/agentRoute.test.jsx'
      - 'app/src/components/StockChart.jsx'
      - 'app/src/components/StockChart.timeRangeSync.test.jsx'
      - 'app/src/pages/charts/grid/**'
      - 'api/services/uct_agent/**'
      - 'api/routers/uct_agent*.py'
      - 'tests/test_uct_agent*.py'
      - 'tools/agent_*'
      # DOCS THE SUITES READ (11-16, AUDIT): editing one of these changes an Agent test's verdict, so it must run Agent CI
      # (tests/test_ci_agent_docs_paths.py discovers the reads and holds this list complete)
      - 'docs/agent/COMPATIBILITY-DECISIONS.md'
      - 'docs/agent/ROADMAP.md'
      - 'docs/agent/CHARTS_COVERAGE_MATRIX.md'
      - 'docs/agent/CHARTS_TEACH_STATUS.md'
      - 'docs/agent/coach/**'
      - 'docs/agent/knowledge/EVIDENCE-ROUTING-DESIGN.md'
      - 'docs/agent/knowledge/e1-eval-seeds.json'
      - 'docs/agent/knowledge/policy.json'
      - 'docs/agent/knowledge/setup-criteria.json'
      - 'docs/agent/program/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches: [agent/int, master]
    paths:
      - 'app/src/agent/**'
      - 'app/src/components/chart/builder/agent*'
      # DUP-RECEIPT (11-05, owner): the page tests that DRIVE the Agent (AgentPanel / useAgent on the real workspace) and
      # the page code they exercise — a regression there was invisible to Agent CI (only the nightly report-only suite ran it)
      - 'app/src/pages/charts/ChartsWorkspace.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.thisChart.test.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.layoutUndoAgent.test.jsx'
      - 'app/src/pages/charts/ChartsWorkspace.previousLayout.test.jsx'
      - 'app/src/pages/charts/widgets/ChartWidget.agent.test.jsx'
      - 'app/src/pages/charts/widgets/TradeExchangeNewsWidget.terminal.test.jsx'
      - 'app/src/pages/breadth/breadthTabHookOrder.test.jsx'
      - 'app/src/components/chart/builder/studio/agentRoute.test.jsx'
      - 'app/src/components/StockChart.jsx'
      - 'app/src/components/StockChart.timeRangeSync.test.jsx'
      - 'app/src/pages/charts/grid/**'
      - 'api/services/uct_agent/**'
      - 'api/routers/uct_agent*.py'
      - 'tests/test_uct_agent*.py'
      - 'tools/agent_*'
      # DOCS THE SUITES READ (11-16, AUDIT): editing one of these changes an Agent test's verdict, so it must run Agent CI
      # (tests/test_ci_agent_docs_paths.py discovers the reads and holds this list complete)
      - 'docs/agent/COMPATIBILITY-DECISIONS.md'
      - 'docs/agent/ROADMAP.md'
      - 'docs/agent/CHARTS_COVERAGE_MATRIX.md'
      - 'docs/agent/CHARTS_TEACH_STATUS.md'
      - 'docs/agent/coach/**'
      - 'docs/agent/knowledge/EVIDENCE-ROUTING-DESIGN.md'
      - 'docs/agent/knowledge/e1-eval-seeds.json'
      - 'docs/agent/knowledge/policy.json'
      - 'docs/agent/knowledge/setup-criteria.json'
      - 'docs/agent/program/**'
      - '.github/workflows/agent-ci.yml'
  # RE-ARM (P2): ONE named PR's evidence run on its current merge commit. Start it only through tools/agent_ci_rearm.py
  # (it refuses a stale merge ref, a conflict, a closed / non-agent / non-master PR). Inputs are never put in a shell.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (an open same-repo agent/** PR into master)'
        required: true
        type: string
      merge_sha:
        description: 'that PR''s current merge commit (pulls/N merge_commit_sha, parents = [master tip, PR head])'
        required: true
        type: string

# P2: an evidence run (pull_request, or a re-arm dispatch) is grouped PER PR (`agent-ci-pr-<N>`), so a push anywhere else
# (another PR, this PR's own branch push run, master) never cancels it. A new push to the SAME PR fires `synchronize`, whose
# run joins the same group and cancels the superseded one (its tree is no longer the PR's); a re-arm of the same PR does
# the same. A base (master) move fires no event, so it cancels nothing: re-arm. Push runs keep `agent-ci-<ref>`, the exact
# group string they had before.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('agent-ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('agent-ci-pr-{0}', github.event.inputs.pr) || format('agent-ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  # DUP-RECEIPT (11-05, owner): + the 8 page tests that drive the Agent (outside src/agent; the shards and the
  # equivalence rail below read this same list, so they stay balanced and complete)
  AGENT_VITEST_PATHS: src/agent src/components/chart/builder/agentMutations src/components/chart/builder/studio/agentRoute.test.jsx src/components/StockChart.timeRangeSync.test.jsx src/pages/breadth/breadthTabHookOrder.test.jsx src/pages/charts/ChartsWorkspace.layoutUndoAgent.test.jsx src/pages/charts/ChartsWorkspace.previousLayout.test.jsx src/pages/charts/ChartsWorkspace.thisChart.test.jsx src/pages/charts/widgets/ChartWidget.agent.test.jsx src/pages/charts/widgets/TradeExchangeNewsWidget.terminal.test.jsx
  # 4 -> 8 (2026-11-16, GitHub Pro: 40 concurrent jobs, was 20). The four runtime-balanced shards each ran 23-28 min,
  # so the browser suite set agent ci's ~30 min wall. Same plan and timings, cut eight ways.
  AGENT_SHARDS: '8'

# A PR from a branch in this repo already ran on its push; running it again on the
# pull_request event only doubles the queue. Fork PRs have no push run here, so they keep it.
# (All three jobs carry the same condition; `union` needs `browser`.)
jobs:
  server:
    name: UCT Agent server tests (production dependency set)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.merge_sha }}   # P2 re-arm: the dispatched merge commit; '' (the default) otherwise
      # Some QA rails diff the tree against the integration branch (e.g. the F-16 rail that proves
      # the member Screener's server code is untouched). A shallow checkout has no such ref.
      - name: Fetch the integration branch for diff-based rails
        run: git fetch --no-tags --quiet origin +refs/heads/agent/int:refs/remotes/origin/agent/int +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Production dependency set + pytest
        run: |
          sudo mkdir -p /data && sudo chown "$(id -u):$(id -g)" /data
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest httpx
      - name: pytest tests/test_uct_agent*.py
        env:
          PYTEST_ADDOPTS: ${{ github.event_name != 'push' && '--junitxml=evidence-pytest.xml' || '' }}   # P2: '' on push
        run: python -m pytest tests/test_uct_agent*.py -q -p no:cacheprovider
      # P2 evidence (pull_request / re-arm runs only): merge commit, tree, parents, failed test names
      - name: Evidence record
        if: always() && github.event_name != 'push'
        run: python3 tools/agent_ci_evidence.py record --job-key server --junit evidence-pytest.xml --out evidence/evidence.json
      - name: Upload the evidence record
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-ci-evidence-pr${{ github.event.pull_request.number || github.event.inputs.pr }}-server
          path: evidence/evidence.json
          if-no-files-found: error

  browser:
    name: UCT Agent browser tests (shard ${{ matrix.shard }}/8)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    # 25 -> 40 (2026-11-11): shard 4/4 hit the 25-min limit and was CANCELLED on #1101 (25m18s) and #1107 (25m12s)
    # while shards 1-3 ran 10-17 min; shard 4 ran 17-22 min on earlier runs the same day. Headroom only, not a redesign:
    # balancing the shards by measured time (as #1064 did for pytest) is the real fix if shard 4 keeps growing.
    # 2026-11-15 (owner D27 #2): that fix is below — the shards are cut by MEASURED time (tools/agent_vitest_shards.py
    # over tools/agent_vitest_shard_timings.json), not by vitest's file-count --shard. The 40-min cap is left as is.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.merge_sha }}   # P2 re-arm: the dispatched merge commit; '' (the default) otherwise
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      # RUNTIME-BALANCED (2026-11-15, owner D27 #2): `--shard=N/4` split by file count, so on five green runs the
      # shards carried 24.6 / 30.0 / 38.2 / 55.6 summed file-minutes (walls ~17 / 19 / 23 / 30 min). Each shard now
      # takes the SAME `vitest list` the union rail uses and runs only its slice of a deterministic, time-balanced
      # partition (greedy longest-first over the committed per-file timings). A file with no recorded time is still
      # assigned (p90 weight, onto the lightest shard); a deleted file's stale timing is ignored. Refresh the timings:
      # see tools/agent_vitest_shards.py's docstring.
      # REFRESHED TIMINGS (2026-11-16): shard-timings-refresh.yml saves fresh per-file times weekly under the key of a
      # FUTURE week. Every shard of a run derives the SAME key from its commit's date and restores it by EXACT key (no
      # fallback keys; cache entries are immutable), so all shards plan from the identical file, or all from the
      # committed tools/agent_vitest_shard_timings.json on a miss. Rails: tests/test_shard_timings_refresh.py.
      - name: Pick this commit's week of shard timings
        id: tweek
        run: echo "week=$(TZ=UTC git log -1 --format=%cd --date=format-local:%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore that week's refreshed shard timings (exact key; a miss keeps the committed file)
        uses: actions/cache/restore@v4
        with:
          path: .shard-timings/agent_vitest_shard_timings.json
          key: agent-shard-timings-${{ steps.tweek.outputs.week }}
      - name: vitest shard
        working-directory: app
        run: |
          npx vitest list $AGENT_VITEST_PATHS --filesOnly > ../agent-files.txt
          T=../tools/agent_vitest_shard_timings.json; [ -s ../.shard-timings/agent_vitest_shard_timings.json ] && T=../.shard-timings/agent_vitest_shard_timings.json; echo "shard timings: $T"
          # a file the refreshed week has no time for (added or split since) is weighed by the committed file (2026-11-17)
          F=../tools/agent_vitest_shard_timings.json
          python3 ../tools/agent_vitest_shards.py --files-list ../agent-files.txt --of "${AGENT_SHARDS}" --timings "$T" --timings-fallback "$F" --plan
          python3 ../tools/agent_vitest_shards.py --files-list ../agent-files.txt --of "${AGENT_SHARDS}" --timings "$T" --timings-fallback "$F" \
            --shard ${{ matrix.shard }} > ../shard-${{ matrix.shard }}.files
          # never fall through to an unfiltered `vitest run` (it would run the whole app suite)
          test -s ../shard-${{ matrix.shard }}.files || { echo "::error::shard ${{ matrix.shard }} has no files"; exit 1; }
          echo "shard ${{ matrix.shard }}: $(wc -l < ../shard-${{ matrix.shard }}.files) files of $(wc -l < ../agent-files.txt)"
          start=$(date +%s)
          npx vitest run $(cat ../shard-${{ matrix.shard }}.files) \
            --reporter=default --reporter=json --outputFile=../shard-${{ matrix.shard }}.json
          echo "shard ${{ matrix.shard }} wall: $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.json
            shard-${{ matrix.shard }}.files
          if-no-files-found: error
      # P2 evidence (pull_request / re-arm runs only): merge commit, tree, parents, failed test names
      - name: Evidence record
        if: always() && github.event_name != 'push'
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/agent_ci_evidence.py record --job-key "browser-$SHARD" --vitest-json "shard-$SHARD.json" --out evidence/evidence.json
      - name: Upload the evidence record
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-ci-evidence-pr${{ github.event.pull_request.number || github.event.inputs.pr }}-browser-${{ matrix.shard }}
          path: evidence/evidence.json
          if-no-files-found: error

  # Mission 2 (2026-11-04): the deterministic CAPABILITY REGRESSION suite, as its own named check — the NL equivalence
  # corpus (routing / deterministic plan / final state), the golden workflows, the capability inventory + coverage
  # rails, and the baseline lock (docs/agent/REGRESSION-SYSTEM.md). Scripted model only: it never calls a paid model,
  # needs no key, and takes about 7 min. The same files ALSO run inside the shards (they live under src/agent), so the union
  # rail and the master deploy gate's `npx vitest run src/agent` keep covering them; this job makes a regression a
  # NAMED failure (branch protection is not available on this plan, so it cannot be made a required check; the
  # enforcement is the master deploy gate's `vitest run src/agent` and the server job's tests/test_uct_agent*.py). Paid live-model evals (tools/agent_eval_*) are separate and never run here.
  # the suite pins Date (testing/clock.js) and runs at BOTH pinned market-clock instants, in PARALLEL (one matrix leg
  # each, its own timeout), so a market-clock dependence can never again turn a gate red at the 09:30 ET open
  # (2026-11-04): `post` = after the close (the default, which the master deploy gate's `vitest run src/agent` uses)
  # and `rth` = the regular session. The baseline (Python) rail runs once, on the `post` leg.
  capability-regression-clock:
    name: UCT Agent capability regression (deterministic, no model) @ ${{ matrix.clock }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clock: [post, rth]
    env:
      CAPREG_CLOCK: ${{ matrix.clock }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.merge_sha }}   # P2 re-arm: the dispatched merge commit; '' (the default) otherwise
      # the baseline rail also holds the corpus to the lock AS IT IS ON MASTER (merge base), so a hand-edited lock in
      # the same PR cannot launder a weakening (review #769)
      - name: Fetch master for the merge-base baseline check
        if: matrix.clock == 'post'
        run: git fetch --no-tags --quiet origin +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-python@v5
        if: matrix.clock == 'post'
        with:
          python-version: '3.12'
      - name: Baseline lock (removing or weakening a baseline entry needs a recorded decision)
        if: matrix.clock == 'post'
        env:
          PYTEST_ADDOPTS: ${{ github.event_name != 'push' && '--junitxml=evidence-pytest.xml' || '' }}   # P2: '' on push
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_uct_agent_capreg_*.py -q -p no:cacheprovider
      # CI COST (2026-11-06, owner): the `post` leg runs ONLY the Python baseline lock above. The vitest
      # capreg suite at the post clock already runs inside the browser shards (it lives under src/agent and
      # `post` is the suite's default clock), and the union rail fails if any shard skips it — so the post
      # leg's own vitest run was a second, identical ~15-minute execution. The `rth` leg is the only place the
      # suite runs at the regular-session clock, so it keeps its vitest run.
      - uses: actions/setup-node@v4
        if: matrix.clock == 'rth'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        if: matrix.clock == 'rth'
        working-directory: app
        run: npm ci
      - name: vitest src/agent/qa/capabilityRegression (CAPREG_CLOCK=${{ matrix.clock }})
        if: matrix.clock == 'rth'
        working-directory: app
        env:
          EVIDENCE_VITEST_ARGS: ${{ github.event_name != 'push' && '--reporter=json --outputFile=../evidence-vitest.json' || '' }}   # P2: '' on push
        run: npx vitest run src/agent/qa/capabilityRegression --reporter=default $EVIDENCE_VITEST_ARGS
      # P2 evidence (pull_request / re-arm runs only): merge commit, tree, parents, failed test names
      - name: Evidence record
        if: always() && github.event_name != 'push'
        run: |
          if [ "$CAPREG_CLOCK" = post ]; then R="--junit evidence-pytest.xml"; else R="--vitest-json evidence-vitest.json"; fi
          python3 tools/agent_ci_evidence.py record --job-key "capability-regression-clock-$CAPREG_CLOCK" $R --out evidence/evidence.json
      - name: Upload the evidence record
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-ci-evidence-pr${{ github.event.pull_request.number || github.event.inputs.pr }}-capability-regression-clock-${{ matrix.clock }}
          path: evidence/evidence.json
          if-no-files-found: error

  # one named result for both clock legs (the check to watch / require)
  capability-regression:
    name: UCT Agent capability regression (deterministic, no model)
    needs: capability-regression-clock
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch' || github.base_ref == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both pinned clocks passed
        run: |
          echo "clock legs: ${{ needs.capability-regression-clock.result }}"
          test "${{ needs.capability-regression-clock.result }}" = "success"
      # P2: this job had no checkout; evidence runs take a one-file sparse one to read the merge commit + tree
      - uses: actions/checkout@v4
        if: always() && github.event_name != 'push'
        with:
          ref: ${{ github.event.inputs.merge_sha }}   # P2 re-arm: the dispatched merge commit; '' (the default) otherwise
          sparse-checkout: |
            tools/agent_ci_evidence.py
          sparse-checkout-cone-mode: false
      # P2 evidence (pull_request / re-arm runs only): merge commit, tree, parents, failed test names
      - name: Evidence record
        if: always() && github.event_name != 'push'
        run: python3 tools/agent_ci_evidence.py record --job-key capability-regression --out evidence/evidence.json
      - name: Upload the evidence record
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-ci-evidence-pr${{ github.event.pull_request.number || github.event.inputs.pr }}-capability-regression
          path: evidence/evidence.json
          if-no-files-found: error

  union:
    name: Shards cover every Agent test file (equivalence rail)
    needs: browser
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.merge_sha }}   # P2 re-arm: the dispatched merge commit; '' (the default) otherwise
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-shard-*
          path: shards
          merge-multiple: true
      - name: Expected file list
        working-directory: app
        run: npx vitest list $AGENT_VITEST_PATHS --filesOnly > ../expected-files.txt && wc -l ../expected-files.txt
      - name: Union of executed files equals the expected list; floor 30; no failures
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path');
          const norm = p => path.resolve(p).replace(/\\/g, '/').replace(/^.*?\/app\//, 'app/');
          const expected = new Set(fs.readFileSync('expected-files.txt', 'utf8').split(/\r?\n/).filter(Boolean).map(f => norm(path.join('app', f))));
          const ran = new Set(), where = new Map(); let failed = 0, passed = 0, files = 0;
          for (const f of fs.readdirSync('shards').filter(f => f.endsWith('.json')).sort()) {
            const r = JSON.parse(fs.readFileSync(path.join('shards', f), 'utf8'));
            for (const t of r.testResults) {
              files++; const k = norm(t.name); ran.add(k);
              where.set(k, [...(where.get(k) || []), f]);
            }
            failed += r.numFailedTests || 0; passed += r.numPassedTests || 0;
          }
          const missing = [...expected].filter(f => !ran.has(f));
          const extra = [...ran].filter(f => !expected.has(f));
          // the time-balanced plan is a partition, so a file in two shards means the plan and the run disagree
          const dupes = [...where].filter(([, s]) => s.length > 1).map(([k, s]) => `${k} (${s.join(', ')})`);
          console.log(`expected ${expected.size} files; shards ran ${ran.size} distinct (${files} total); passed ${passed}, failed ${failed}`);
          if (missing.length) { console.log('::error::files no shard ran:\n' + missing.join('\n')); }
          if (extra.length) { console.log('::warning::files ran but not in the expected list:\n' + extra.join('\n')); }
          if (dupes.length) { console.log('::error::files more than one shard ran:\n' + dupes.join('\n')); }
          if (ran.size < 30) { console.log('::error::fewer than 30 Agent test files ran'); process.exit(1); }
          if (missing.length || dupes.length || failed > 0) process.exit(1);
          EOF
      # P2 evidence (pull_request / re-arm runs only): merge commit, tree, parents, failed test names
      - name: Evidence record
        if: always() && github.event_name != 'push'
        run: |
          set --; for f in shards/shard-*.json; do if [ -f "$f" ]; then set -- "$@" --vitest-json "$f"; fi; done
          python3 tools/agent_ci_evidence.py record --job-key union "$@" --out evidence/evidence.json
      - name: Upload the evidence record
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agent-ci-evidence-pr${{ github.event.pull_request.number || github.event.inputs.pr }}-union
          path: evidence/evidence.json
          if-no-files-found: error
