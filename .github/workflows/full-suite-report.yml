# ─── THE FULL SUITES, REPORTED — NOT ENFORCED ───────────────────────────────
#
# ⚰️ WHY THIS EXISTS. Measured 2026-09-15: this repository holds **1,353 vitest files
# and 1,429 pytest files**, and CI runs **22 and 6** of them respectively. Every other
# test — 2,754 files, 99.0% — has only ever run on one laptop, at the moment someone
# chose to type the command. `chordCollision.test.js`, the rail that found F-S2-1,
# appears in ZERO workflows.
#
# ⛔⛔ THIS JOB IS REPORT-ONLY AND MUST STAY THAT WAY UNTIL ITS PROMOTION CRITERION IS
# MET. `continue-on-error: true` at the job level, and it is deliberately NOT added to
# any branch protection rule. A brand-new job that can block a merge, on a suite nobody
# has ever seen run in CI, converts an unknown number of pre-existing failures into an
# outage of the merge queue on its first morning.
#
#   PROMOTION CRITERION (state it in the ledger, then promote in a separate unit):
#   ≥1 GREEN run and ≥1 RED run recorded in the ledger, so the job has been observed
#   both passing and failing. A gate nobody has seen fail is not a gate
#   (`lesson_gate_that_cannot_fail`); a gate nobody has seen pass is worse.
#
# ⛔ IT DOES NOT TOUCH THE LAYER-0 PRE-PUSH GUARD. That guard serialises master pushes
# and is unrelated; nothing here runs on master.
#
# ─── KNOWN RED, AT LANDING ──────────────────────────────────────────────────
#
# The first runs WILL be red. Diff against this list before calling anything new:
#
#   | test file                                        | finding | why |
#   |--------------------------------------------------|---------|-----|
#   | app/src/pages/ThemeTrackerPage.chartmount.test.jsx| PACKET-T| STALE - asserts an
#   |                                                  |         | auto-open removed by
#   |                                                  |         | 453ecc3ec. Green once
#   |                                                  |         | Packet T lands.
#   | app/src/components/screener/reachable.test.js     | R-29    | BY DESIGN - names
#   |                                                  | F-S1-2  | focusDivergence.js
#   |                                                  |         | (S4 CP1) and
#   |                                                  |         | surfaces/manifest.js
#   |                                                  |         | (S1 CP1), both
#   |                                                  |         | deliberately unmounted.
#
# ⚠️ THE LIST ABOVE IS NOT A FULL INVENTORY, AND SAYING SO IS THE POINT. It was
# derived from SCOPED local runs, because this box cannot run either suite whole:
# `pytest tests/` has reached 18 GB and been OOM-killed here (`--collect-only` alone
# reached 6.6 GB), and a concurrent full run once swept a worktree's `node_modules` and
# its `.git` file. **The first CI run is therefore the first complete measurement this
# repository has ever had**, and its output is the inventory. Copy it into this header,
# with a finding id per row, before anyone argues about promotion.

name: full suite (report-only)

on:
  push:
    branches: [feat/s7-price-level]
  pull_request:
    branches: [master]
  workflow_dispatch:

# ⛔ Never cancel a previous run: the whole value of this job is a complete record of
# which tests were red on which commit, and a cancelled run leaves a hole that reads
# exactly like a green one.
concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: false

# ⛔ Read at the top. ONLY the `publish` job raises this, and only to write the
# orphan `ci-results` branch — never a source branch, never master.
permissions:
  contents: read

jobs:
  vitest:
    name: vitest — all files (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      # ⛔ `npx vitest run -t <pattern>` is a REGEX and a filter matching nothing exits
      # 0 — a false PASS. No filter is used here for exactly that reason.
      - name: Run
        working-directory: app
        # E CP4: the default reporter feeds the human log and the totals-line
        # assertion; the junit report is what `tools/ci_extract.py` turns into
        # per-test failure text. Counts alone are a status badge, not a diagnosis.
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../vitest-junit.xml 2>&1 | tee ../vitest.log
      # ⛔ A RUN WITHOUT A TOTALS LINE IS NOT A RUN. The pipe above means this step's
      # exit code is tee's, so the totals line is asserted explicitly rather than
      # inferred from a status.
      - name: Assert the run produced a totals line
        if: always()
        run: |
          grep -E "Test Files|Tests " vitest.log || {
            echo "::error::vitest produced no totals line — this is NOT a green run"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-log
          path: |
            vitest.log
            vitest-junit.xml

  pytest:
    name: pytest — all files (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --quiet pytest pytest-asyncio httpx numpy pillow
      # ⚠️ A RUNNER IS NOT THIS BOX. An unscoped `pytest tests/` is forbidden locally
      # because collection alone has reached 6.6 GB here; a clean CI runner is the only
      # place it can be attempted, and `-p no:cacheprovider` keeps it reproducible.
      - name: Run
        # E CP4: --junitxml is structured; the text log keeps the ERROR collecting
        # sections, which is where a COLLECTION failure explains itself. 479 errors
        # with 2 collected means the suite never ran, and only the text says why.
        run: python -m pytest tests/ -q -p no:cacheprovider --junitxml=pytest-junit.xml 2>&1 | tee pytest.log
      - name: Assert the run produced a totals line
        if: always()
        run: |
          grep -E "passed|failed|error" pytest.log || {
            echo "::error::pytest produced no totals line — this is NOT a green run"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log
          path: |
            pytest.log
            pytest-junit.xml

  publish:
    name: publish the result into the repo (ci-results)
    needs: [vitest, pytest]
    if: always()
    runs-on: ubuntu-latest
    # ⛔ THE ONLY JOB THAT CAN WRITE, and it writes one orphan branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with: { name: vitest-log, path: logs }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: pytest-log, path: logs }
        continue-on-error: true

      # ⛔ A MISSING LOG IS NOT A GREEN SUITE. If a job died before writing one, the
      # summary must say `totals_line_found: false`, which is what an empty file yields.
      - name: Summarise
        run: |
          touch logs/vitest.log logs/pytest.log
          python tools/ci_summarize.py --suite vitest --log logs/vitest.log --out v.json
          python tools/ci_summarize.py --suite pytest --log logs/pytest.log --out p.json

      # E CP4 — the error TEXT, bucketed, beside the counts.
      - name: Extract the failure text
        if: always()
        run: |
          python tools/ci_extract.py \
            --pytest-log logs/pytest.log \
            --vitest-log logs/vitest.log \
            --vitest-junit logs/vitest-junit.xml \
            --out-dir "extract/$GITHUB_RUN_ID"
          cp logs/pytest-junit.xml "extract/$GITHUB_RUN_ID/" 2>/dev/null || true
          cp logs/vitest-junit.xml "extract/$GITHUB_RUN_ID/" 2>/dev/null || true
          ls -la "extract/$GITHUB_RUN_ID"

      - name: Build the record
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          v = json.loads(pathlib.Path("v.json").read_text())
          p = json.loads(pathlib.Path("p.json").read_text())
          rec = {
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
            "sha": os.environ["GITHUB_SHA"],
            "branch": os.environ.get("GITHUB_REF_NAME"),
            "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "vitest": v,
            "pytest": p,
            "oom_or_timeout": bool(v["oom_or_timeout"] or p["oom_or_timeout"]),
            "runner_line": {"vitest": v["runner_line"], "pytest": p["runner_line"]},
            # ⛔ GREEN means both suites actually RAN and neither failed. A suite that
            # collected nothing is never green.
            "verdict": ("GREEN" if (v["ok"] and p["ok"] and not v["failed"]
                                    and not p["failed"]) else "RED"),
            # E CP4 -- where the TEXT lives for this run. Paths are relative to the
            # ci-results branch root, so a reader needs no knowledge of this workflow.
            "detail": {
              "dir": "results/%s" % os.environ["GITHUB_RUN_ID"],
              "pytest_collect_errors": "results/%s/pytest_collect_errors.txt" % os.environ["GITHUB_RUN_ID"],
              "pytest_error_buckets": "results/%s/pytest_error_buckets.txt" % os.environ["GITHUB_RUN_ID"],
              "vitest_failures": "results/%s/vitest_failures.txt" % os.environ["GITHUB_RUN_ID"],
              "pytest_junit": "results/%s/pytest-junit.xml" % os.environ["GITHUB_RUN_ID"],
              "vitest_junit": "results/%s/vitest-junit.xml" % os.environ["GITHUB_RUN_ID"],
            },
          }
          pathlib.Path("record.json").write_text(json.dumps(rec, indent=2) + "\n")
          print(json.dumps(rec, indent=2))
          PY

      - name: Publish onto the orphan ci-results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN="$GITHUB_RUN_ID"
          cp record.json "/tmp/$RUN.json"
          # ⛔ The orphan checkout below wipes the working tree, so anything that must
          # survive it is copied OUT first. /tmp is outside the repo and survives.
          if [ -d "extract/$RUN" ]; then
            mkdir -p "/tmp/extract"
            cp -r "extract/$RUN" "/tmp/extract/"
          fi
          # create the orphan branch on first use; never rebase, never force
          if git ls-remote --exit-code --heads origin ci-results >/dev/null 2>&1; then
            git fetch origin ci-results
            git checkout ci-results
          else
            git checkout --orphan ci-results
            git rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' "# ci-results" "" \
              "Machine-readable results of the report-only full-suite workflow." \
              "One file per run under results/, plus results/latest.json." \
              "Written by .github/workflows/full-suite-report.yml. Do not edit by hand." \
              > README.md
          fi
          mkdir -p results
          cp "/tmp/$RUN.json" "results/$RUN.json"
          cp "/tmp/$RUN.json" results/latest.json
          # E CP4 -- the per-run detail directory travels with the record
          if [ -d "/tmp/extract/$RUN" ]; then
            mkdir -p "results/$RUN"
            cp -r "/tmp/extract/$RUN/." "results/$RUN/"
          fi
          git add results README.md 2>/dev/null || git add results
          git commit -m "ci run $RUN on $GITHUB_REF_NAME ($GITHUB_SHA)" || exit 0
          git push origin ci-results
