[pytest]
asyncio_mode = auto

# Every directory that holds a real suite. There were NO testpaths here, so a
# bare `pytest` had to guess and every runner in this repo globbed `tests/**` --
# which walked past the 93 collectable test files under `api/**` (1,289 of them
# passing, 3 failing and one HANGING, unnoticed, for as long as they existed).
#
# WARNING: testpaths is IGNORED the moment pytest is given a path argument, and
# the real runners here (chunked suite runs, the mutation gauntlets) all pass
# explicit paths. So this line alone would be a fix that cannot fail. The
# enforcement is tests/test_test_discovery_coverage.py, which fails BY NAME on
# any collectable test file living outside these roots -- add a root here and it
# goes quiet; leave one out and it names every orphan.
#
# Kept ASCII on purpose: this file is parsed by tools that may open it under the
# box's cp1252 locale rather than utf-8.
testpaths =
    tests
    api

# A WALL-CLOCK BOUND ON EVERY TEST, and the number is measured, not picked.
#
# `@pytest.mark.timeout(10)` sat on two tests in api/routers/stream_bars_test.py
# while pytest-timeout was NOT installed, so an unregistered mark was silently
# ignored: a gate that could not fail. It was not hypothetical -- that same file
# hung the whole suite (an infinite SSE generator behind a stale assertion) and
# the fix had to be a hand-rolled faulthandler watchdog because the marker did
# nothing. pytest-timeout is now pinned in requirements.txt and
# tests/test_requirements_pins.py fails if either half goes missing.
#
# WHY A REPO-WIDE DEFAULT, AND WHY THIS BIG.
# The failure a default prevents is UNBOUNDED -- a hung test consumes the entire
# run, and nothing else in this repo notices. The failure it can CAUSE is a slow
# test being cut off, which is bounded and visible. So a default is worth having,
# and the only question is the number.
#
# It has to be generous, because on Windows pytest-timeout has no SIGALRM and
# falls back to `timeout_method = thread`, which KILLS THE PROCESS rather than
# failing one test: a budget set too low turns a chunk into a dead chunk with no
# pytest summary, not a red test. (On Linux the `signal` method fails just the
# test, so the method is deliberately left to auto-select rather than pinned.)
#
# MEASURED on this box over the whole collection (tests/ + api/, 11,000+ tests):
# the slowest single test is 84.3s (tests/pattern_engine/test_schedulers.py::
# test_universe_scan_job_callable); the next is 37.3s; NOTHING under api/** takes
# even 1s. 300 is 3.6x the slowest and leaves room for a loaded box.
#
# NOTE this bounds ONE TEST, not the run. A legitimate full suite here takes
# ~20 minutes and is completely unaffected.
timeout = 300

markers =
    benchmark: informational latency benchmarks; not run in CI
