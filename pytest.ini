[pytest]
asyncio_mode = auto

# Every directory that holds a real suite. There were NO testpaths here, so a
# bare `pytest` had to guess and every runner in this repo globbed `tests/**` --
# which walked past the 93 collectable test files under `api/**` (1,289 of them
# passing, 3 failing and one HANGING, unnoticed, for as long as they existed).
#
# WARNING: testpaths is IGNORED the moment pytest is given a path argument, and
# the real runners here (chunked suite runs, the mutation gauntlets) all pass
# explicit paths. So this line alone would be a fix that cannot fail. The
# enforcement is tests/test_test_discovery_coverage.py, which fails BY NAME on
# any collectable test file living outside these roots -- add a root here and it
# goes quiet; leave one out and it names every orphan.
#
# Kept ASCII on purpose: this file is parsed by tools that may open it under the
# box's cp1252 locale rather than utf-8.
testpaths =
    tests
    api

markers =
    benchmark: informational latency benchmarks; not run in CI
