<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="32%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="65%" stop-color="#0a0604"/>
      <stop offset="100%" stop-color="#06040a"/>
    </radialGradient>
    <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f5e8c8"/>
      <stop offset="50%"  stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#9c7d2a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle parchment cross-hatch -->
  <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="14" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#hatch)"/>

  <!-- Equity curve fill (subtle) -->
  <path d="M 90 540 C 150 535, 180 520, 210 510 S 270 480, 310 505 C 350 530, 390 535, 430 495 S 510 430, 560 445 C 610 460, 640 440, 680 400 S 760 340, 810 365 C 860 390, 890 350, 930 290 S 1010 200, 1060 170 C 1095 150, 1115 100, 1130 60 L 1130 580 L 90 580 Z"
        fill="url(#fill)" opacity="0.6"/>
  <!-- Equity curve line -->
  <path d="M 90 540 C 150 535, 180 520, 210 510 S 270 480, 310 505 C 350 530, 390 535, 430 495 S 510 430, 560 445 C 610 460, 640 440, 680 400 S 760 340, 810 365 C 860 390, 890 350, 930 290 S 1010 200, 1060 170 C 1095 150, 1115 100, 1130 60"
        fill="none" stroke="url(#curve)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Marker at the peak -->
  <g transform="translate(1130 60)">
    <circle r="14" fill="#4ade80" opacity="0.18"/>
    <circle r="9"  fill="#c9a84c" opacity="0.4"/>
    <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#fff4d6" transform="rotate(45)"/>
  </g>

  <!-- Compass (left side) -->
  <g transform="translate(220 315)">
    <circle r="120" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.85"/>
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
    <!-- Needle pointing roughly toward equity marker -->
    <g transform="rotate(50)">
      <rect x="-3" y="-90" width="6" height="90" fill="#ef4444"/>
      <rect x="-3" y="0"   width="6" height="90" fill="#4ade80"/>
      <circle r="10" fill="#c9a84c" stroke="#1a1208" stroke-width="2"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="420" y="280"
        font-family="Inter, -apple-system, system-ui, sans-serif"
        font-size="78" font-weight="600"
        fill="url(#word)" letter-spacing="-3">UCT Intelligence</text>

  <!-- Tagline -->
  <text x="420" y="330"
        font-family="Inter, system-ui, sans-serif"
        font-size="26" font-weight="400"
        fill="#c9a84c">Navigate the market, effectively.</text>

  <!-- Value pills -->
  <g font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600"
     fill="#c9a84c" letter-spacing="1.5">
    <g transform="translate(420 390)">
      <rect x="0" y="0" width="140" height="32" rx="16"
            fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
      <text x="70" y="21" text-anchor="middle">MORNING WIRE</text>
    </g>
    <g transform="translate(570 390)">
      <rect x="0" y="0" width="92" height="32" rx="16"
            fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
      <text x="46" y="21" text-anchor="middle">UCT 20</text>
    </g>
    <g transform="translate(672 390)">
      <rect x="0" y="0" width="120" height="32" rx="16"
            fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
      <text x="60" y="21" text-anchor="middle">AI COMPASS</text>
    </g>
    <g transform="translate(802 390)">
      <rect x="0" y="0" width="148" height="32" rx="16"
            fill="none" stroke="#c9a84c" stroke-opacity="0.4"/>
      <text x="74" y="21" text-anchor="middle">STOCK CATALYSTS</text>
    </g>
  </g>

  <!-- Bottom CTA strip -->
  <text x="420" y="470"
        font-family="Inter, system-ui, sans-serif"
        font-size="20" font-weight="500"
        fill="#e4e6ea">A complete trading desk in one app.</text>
  <text x="420" y="500"
        font-family="Inter, system-ui, sans-serif"
        font-size="16" font-weight="400"
        fill="#9ca3af">From $20 a month · Five tools free forever · No card required.</text>

  <!-- Brand mark bottom-right -->
  <g transform="translate(1110 580)">
    <circle r="18" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-family="Inter, sans-serif"
          font-size="14" font-weight="700" fill="#c9a84c">⊕</text>
  </g>
  <text x="1080" y="586" text-anchor="end"
        font-family="Inter, system-ui, sans-serif"
        font-size="11" font-weight="600"
        fill="#c9a84c" letter-spacing="2">UCT INTELLIGENCE</text>
</svg>
