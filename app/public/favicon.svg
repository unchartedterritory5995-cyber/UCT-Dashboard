<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Uncharted Territory mark on the brand tile, replacing a placeholder
       letter "U". Geometry is the vector trace in
       app/src/components/brand/UTMark.jsx (100x100 box, centred on 50,50),
       scaled to fit: translate(1.3 1.3) scale(0.294) -> a 29.4px mark with
       ~1.3px of breathing room inside the 32px tile.

       Keep the two in sync — UTMark.jsx carries the measurements and the
       reasoning behind them; this is a static copy for the browser tab. -->
  <rect width="32" height="32" rx="6" fill="#0e0f0d"/>
  <g transform="translate(1.3 1.3) scale(0.294)">
    <g fill="none" stroke-width="11">
      <path d="M 77.43 48.08 A 27.5 27.5 0 0 1 57.12 76.56" stroke="#E23E23"/>
      <path d="M 52.4 77.4 A 27.5 27.5 0 0 1 23.57 57.58" stroke="#67DB44"/>
      <path d="M 22.7 53.35 A 27.5 27.5 0 0 1 42.88 23.44" stroke="#E23E23"/>
      <path d="M 48.08 22.57 A 27.5 27.5 0 0 1 76.68 43.35" stroke="#67DB44"/>
    </g>
    <path d="M 50 1.75 Q 51.8 22 53.6 28 L 46.4 28 Q 48.2 22 50 1.75 Z" fill="#67DB44"/>
    <path d="M 50 1.75 Q 51.8 22 53.6 28 L 46.4 28 Q 48.2 22 50 1.75 Z" fill="#E23E23" transform="rotate(90 50 50)"/>
    <path d="M 50 1.75 Q 51.8 22 53.6 28 L 46.4 28 Q 48.2 22 50 1.75 Z" fill="#67DB44" transform="rotate(180 50 50)"/>
    <path d="M 50 1.75 Q 51.8 22 53.6 28 L 46.4 28 Q 48.2 22 50 1.75 Z" fill="#E23E23" transform="rotate(270 50 50)"/>
    <rect x="48.75" y="30" width="2.5" height="20.6" fill="#67DB44"/>
    <rect x="48.75" y="50.6" width="2.5" height="20.4" fill="#E23E23"/>
    <path d="M 42.9 33.5 L 57.1 33.5 L 42.9 67.7 Z" fill="#67DB44"/>
    <path d="M 57.1 33.5 L 57.1 67.7 L 42.9 67.7 Z" fill="#E23E23"/>
  </g>
</svg>
