<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: when the soft keyboard opens it shrinks
         the layout viewport (and 100dvh) instead of overlaying content, so sticky
         footers / submit buttons in forms stay above the keyboard on mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Primary meta ── -->
    <title>UCT Intelligence — 10 subscriptions in 1. The complete trading desk.</title>
    <meta name="description" content="A complete trading desk run by an AI research team — the Morning Wire brief at 7:35 AM, vetted catalysts, a coach on every trade, a journal that writes itself. 7-day free trial." />
    <meta name="author" content="Uncharted Territory" />
    <link rel="canonical" href="https://uctintelligence.com/" />

    <!-- ── Open Graph (Facebook / LinkedIn / Discord) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uctintelligence.com/" />
    <meta property="og:title" content="UCT Intelligence — 10 subscriptions in 1. The complete trading desk." />
    <meta property="og:description" content="A complete trading desk run by an AI research team. The brief at 7:35 AM, vetted catalysts, a coach on every trade. 7-day free trial." />
    <meta property="og:image" content="https://uctintelligence.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="UCT Intelligence" />

    <!-- ── Twitter / X ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UCT Intelligence — 10 subscriptions in 1. The complete trading desk." />
    <meta name="twitter:description" content="A complete trading desk run by an AI research team. The brief at 7:35 AM, vetted catalysts, a coach on every trade. 7-day free trial." />
    <meta name="twitter:image" content="https://uctintelligence.com/og-image.svg" />

    <!-- ── Fonts: preconnect + preload for LCP ── -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Single request for both brand families: Instrument Sans — the single brand face (UI + landing, numbers included). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    />

    <!-- ── YouTube: warm DNS/TLS for the Desk video library + player ──
         Thumbnails come from i.ytimg.com; the IFrame Player API + embed come
         from youtube.com (player assets from gstatic). Pre-connecting here so
         the FIRST video play / gallery render doesn't pay a cold DNS+TLS
         handshake on the critical path. (No ad/tracking domains — privacy.) -->
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://yt3.ggpht.com" />

    <!-- ── JSON-LD: SoftwareApplication schema for rich search results ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "UCT Intelligence",
      "alternateName": "Uncharted Territory Intelligence",
      "url": "https://uctintelligence.com/",
      "image": "https://uctintelligence.com/og-image.svg",
      "description": "A complete trading desk run by an AI research team — the Morning Wire brief at 7:35 AM, vetted catalysts, an AI coach on every trade, a journal that writes itself, and a live community.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, iOS, Android",
      "browserRequirements": "Requires JavaScript. Requires a modern browser.",
      "offers": [
        {
          "@type": "Offer",
          "name": "UCT Intelligence — monthly",
          "price": "200",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "200.00",
            "priceCurrency": "USD",
            "billingDuration": "P1M"
          },
          "description": "The complete desk, unmetered — Morning Wire, Stock Catalysts, Compass AI coach, Voice Assistant, UCT 20, Breadth, LiveFlow, Charts, Journal 2.0, The Floor, The Desk. 7-day free trial."
        },
        {
          "@type": "Offer",
          "name": "UCT Intelligence — annual",
          "price": "2000",
          "priceCurrency": "USD",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "2000.00",
            "priceCurrency": "USD",
            "billingDuration": "P1Y"
          },
          "description": "The complete desk, billed annually — two months free vs monthly."
        }
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Uncharted Territory",
        "url": "https://uctintelligence.com/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
