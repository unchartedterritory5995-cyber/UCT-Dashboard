<!doctype html>
<!-- data-theme="oled" is the app-wide default (see hooks/usePreferences +
     components/Layout.jsx). Setting it here means the FIRST paint before React
     mounts is already OLED black, not the retired bare-:root palette. Layout
     switches it to "light" only when the user's saved theme is Light. -->
<html lang="en" data-theme="oled">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash theme: replay the last resolved app theme (data-theme base +
         inline token bag, cached by components/Layout.jsx via writeThemeCache)
         BEFORE first paint, so a Graphite/uct: user never sees the OLED default
         flash while prefs load from the server. Dumb applier — theme logic lives
         in styles/appThemes.js. Falls back to the html data-theme when uncached. -->
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('uct.appTheme.v1') || 'null');
          if (c && c.dataTheme) {
            var el = document.documentElement;
            el.setAttribute('data-theme', c.dataTheme);
            if (c.vars) for (var k in c.vars) el.style.setProperty(k, c.vars[k]);
          }
        } catch (e) {}
      })();
    </script>
    <!-- interactive-widget=resizes-content: when the soft keyboard opens it shrinks
         the layout viewport (and 100dvh) instead of overlaying content, so sticky
         footers / submit buttons in forms stay above the keyboard on mobile. -->

    <!-- ══ Fonts: SELF-HOSTED (app/public/fonts, served by the /fonts mount in
         api/main.py). Instrument Sans is the brand face AND the chart's axis font.
         ⛔ DO NOT put this back on fonts.googleapis.com: lightweight-charts bakes
         whichever font resolves AT DRAW TIME into its axis <canvas> and never
         repaints, so a third-party font host is a CORRECTNESS dependency of every
         chart — including the headless Morning Wire → Substack renderer, which
         drives this page. Measured: delaying the font 2.5 s moved 4,911 px of a
         parity capture. Full account: tools/chart_parity.py (TEXT_FONT_PROBE_JS)
         + docs/runbooks/chart-parity-gate.md; gated by tests/test_chart_parity_harness.py.
         The blocks below TRANSCRIBE what Google's css2 API served (v4, Chrome UA)
         — same styles/weights/font-display/unicode-range, only the URLs changed,
         and the .woff2 files are Google's own binaries byte-for-byte.
         ⚠️ There is NO 300 face: Instrument Sans is a 400–700 variable font, so
         the old `0,300` in that URL already resolved to 400. Do not add one. ══ -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-v4-latin.woff2" crossorigin />
    <!-- ⛔ AND THE TAB FACE, WHICH IS THE ONE THE CHART AXIS ACTUALLY DRAWS IN.
         `a475f5a55` self-hosted the axis font and preloaded the latin subset;
         `cc945fc64` then introduced 'Instrument Sans Tab' (tabular figures, baked
         in because canvas ignores font-variant-numeric) for that very axis and did
         not extend the preload. So from 2026-08-13 the face was not requested until
         the first chart tried to draw with it — and lightweight-charts bakes
         whichever font resolves AT DRAW TIME into the axis canvas and never
         repaints it. Measured: the parity gate's font probe reported 174 of 230
         canvas text operations running before this family was ready, on clean
         master as well as on any branch, which is `FontNotSettledError` and an
         unrunnable gate. The same page is the headless Morning Wire → Substack
         renderer, so the exposure self-hosting was adopted to remove had quietly
         returned for the axis labels. One line, the same pattern as the line
         above: same `as`/`type`/`crossorigin`, an asset already on disk and
         already declared below. ══ -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-v4-latin-tab.woff2" crossorigin />

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;

      /* Instrument Sans Tab — a tabular-figures (tnum-frozen) build of the latin
         face, used ONLY by the chart canvas axis so numeric price/MA labels are
         equal-width and their boxes align (canvas ignores font-variant-numeric,
         so the feature is baked into the file). Latin range only; any non-digit /
         latin-ext glyph falls back to regular 'Instrument Sans' via the stack. */
      @font-face {
        font-family: 'Instrument Sans Tab'; font-style: normal; font-weight: 400 700;
        font-stretch: 100%; font-display: swap;
        src: url(/fonts/instrument-sans-v4-latin-tab.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <!-- ⭐⭐ AND THE PRELOAD ALONE IS NOT ENOUGH — MEASURED, TWICE. A preload
         fetches the BYTES; it does not ACTIVATE the FontFace. A CSS @font-face is
         activated lazily, on first use for layout or paint, and
         `document.fonts.check()` stays false until it is. 'Instrument Sans' gets
         activated early for free because the SPA chrome renders text in it;
         'Instrument Sans Tab' is used by NOTHING except the chart's canvas axis,
         so the first `measureText` the chart issues is itself the activation
         trigger and can only ever run unready. With the preload added and nothing
         else, the gate's probe still reported exactly 1 unready op, every run.
         With this line it reports 0 of 203 / 0 of 176 / 0 of 193, 0 reloads — the
         signature `docs/runbooks/chart-parity-gate.md` records for a settled page.

         ⚠️ IT IS NOT A DELAY AND IT BYPASSES NOTHING. Fire-and-forget at parse
         time, awaited by no one; it asks the browser to activate a face the page
         has already declared and already preloaded one line above.
         `StockChart.jsx` ALREADY calls `document.fonts.load("11px 'Instrument Sans
         Tab'")` for the same reason — but gated on `chartReady`, i.e. AFTER the
         first axis is measured and drawn, which is why it has to force a repaint
         afterwards. Doing it here as well means the face is usually ready for the
         FIRST paint, so that repaint has nothing ragged to correct. ══ -->
    <script>try { document.fonts && document.fonts.load && document.fonts.load("11px 'Instrument Sans Tab'") } catch (e) { /* no FontFaceSet: the @font-face still applies */ }</script>

    <!-- ── YouTube: warm DNS/TLS for the Desk video library + player ──
         Thumbnails come from i.ytimg.com; the IFrame Player API + embed come
         from youtube.com (player assets from gstatic). Pre-connecting here so
         the FIRST video play / gallery render doesn't pay a cold DNS+TLS
         handshake on the critical path. (No ad/tracking domains — privacy.) -->

    <link rel="dns-prefetch" href="https://www.youtube.com" />
