<!doctype html>
<!--
  DEVICE VALIDATION HARNESS — mounts the REAL phone chart shell for on-hardware
  checks. Dev-server only; it is not an app route and never ships in a build.

  ⛔ NOT AN AUTH BYPASS. There is no backend in the picture: `fetch` is answered
  in-page with canned data, so nothing here can reach real accounts or real
  data. See the header of src/testing/device/mobileShellHarness.jsx.

  Run:  npx vite --config vite.device.config.mjs
  Then: http://127.0.0.1:8093/device-harness.html   (or bs-local.com:8093/... from a device)
-->
<html lang="en" data-theme="oled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UCT phone shell — device harness</title>
    <style>
      html, body { margin: 0; background: #0e0f0d; color: #e2dfd6;
        font: 11.5px/1.32 -apple-system, system-ui, sans-serif; }
      /* The verdict panel is FIXED and on top: a 1-minute session has no budget
         for scrolling to find the results. */
      #verdicts { position: fixed; inset: 0 0 auto 0; z-index: 2147483647;
        max-height: 46vh; overflow: auto; padding: 5px 7px;
        background: rgba(8,9,7,0.94); border-bottom: 1px solid #333; }
      #shell { position: absolute; inset: 0; padding-top: 46vh; }
    </style>
  </head>
  <body>
    <div id="verdicts">booting…</div>
    <div id="shell"></div>
    <script type="module" src="/src/testing/device/mobileShellHarness.jsx"></script>
  </body>
</html>
