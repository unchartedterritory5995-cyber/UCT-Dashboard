# UCT inbound-email worker — see README.md and docs/notebook/email-in-setup.md.
name = "uct-inbound-email"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Reached only by Email Routing, never over HTTP.
workers_dev = false

[vars]
INBOUND_URL = "https://uctintelligence.com/api/j2/inbound-email"

# The signing secret is NOT here. Set it with:
#   npx wrangler secret put NOTEBOOK_INBOUND_EMAIL_SECRET
